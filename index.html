<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>看牛的方式 v1.4</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: "PingFang HK", "PingFang TC", "Heiti TC", "Noto Sans TC", sans-serif;
    color: #fff;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%;   /* M8B: no pull-to-refresh / bounce, no text zoom */
  }
  /* M8B: no text selection / callout anywhere (iPad long-press) */
  *, *::before, *::after { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .serif { font-family: "Songti TC", "STSong", "Noto Serif TC", "PingFang HK", serif; }
  #gl { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; }   /* M9e: not 100vh (taller than the visible area on phones); JS sets the real size */

  /* ---------- UI layer (everything here fades during 凝視) ---------- */
  #ui { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; transition: opacity 1s ease; z-index: 10; }
  body.gazing #ui { opacity: 0; }

  #brk { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: opacity .6s ease, transform .9s cubic-bezier(.5,0,.8,.4); }

  #hud {
    position: absolute; top: 16px; left: 16px; width: 262px; padding: 10px 14px; border-radius: 12px;
    background: rgba(10, 22, 44, 0.55); font-size: 15px; line-height: 1.5;
    font-variant-numeric: tabular-nums; opacity: 0;
    transition: opacity .6s ease, transform .9s cubic-bezier(.5,0,.8,.4);
  }
  #hud.show { opacity: 1; }
  #hud .row { display: flex; justify-content: space-between; align-items: baseline; }
  #hud b { color: #ffe3a8; font-weight: 600; }
  #hud .ok b { color: #9cffb0; }
  #hud .tg { font-size: 12px; opacity: .7; margin-left: 6px; }
  #hud .bar { height: 5px; border-radius: 3px; margin: 2px 0 7px 0; max-width: 234px; }
  #hud .bar.y { background: #ffb347; }
  #hud .bar.c { background: #cfe8ff; }
  #hud .hold { height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); margin: 5px 0 6px 0; overflow: hidden; }
  #hud .hold i { display: block; height: 100%; background: #9cffb0; }
  #hud .dist { font-size: 13px; opacity: .8; }

  #map {
    position: absolute; top: 16px; right: 16px; width: 308px; opacity: 0; border-radius: 10px;
    transition: opacity .6s ease, transform .9s cubic-bezier(.5,0,.8,.4);
  }
  #map.show { opacity: 1; }
  #map canvas { width: 308px; height: 150px; display: block; border-radius: 8px; }
  #map .lbls { display: flex; justify-content: space-between; font-size: 12px; opacity: .8; margin-top: 4px; }
  #map .lbls span { width: 150px; text-align: center; }

  /* 「最後一把尺」: HUD + mini-map glow together, inviting one swipe */
  #hud.ruler, #map.ruler { animation: rulerGlow 2.4s ease-in-out infinite; }
  @keyframes rulerGlow {
    0%, 100% { box-shadow: 0 0 0 1px rgba(255,227,168,.35); }
    50% { box-shadow: 0 0 0 2px rgba(255,227,168,.85), 0 0 22px rgba(255,227,168,.45); }
  }

  #lastRuler {
    position: absolute; top: 200px; right: 16px; width: 308px; text-align: center;
    font-size: 20px; letter-spacing: .2em; opacity: 0;
    transition: opacity 1.5s ease, transform .9s cubic-bezier(.5,0,.8,.4);
  }
  #lastRuler.show { opacity: .75; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: .9; } }

  #toast {
    position: absolute; left: 0; right: 0; top: max(24%, 200px); text-align: center; font-size: 24px; letter-spacing: .06em;
    padding: 0 10%; opacity: 0; transition: opacity .4s ease; text-shadow: 0 2px 10px rgba(0,0,0,.7);
    line-height: 1.45; will-change: opacity;
  }
  /* M9c: top ≥ 200px → always below the stage-3 gauge (bottom ≈ 172px) and the mini-map (≈ 187px); ≤ 2 lines on iPad */
  #toast.show { opacity: .92; }

  #hint {
    position: absolute; left: 0; right: 0; bottom: 86px; text-align: center; padding: 0 12%; line-height: 1.3;
    font-size: 26px; letter-spacing: .12em; opacity: 0; transition: opacity 1.2s ease; will-change: opacity;
    text-shadow: 0 1px 8px rgba(0,0,0,.6);
  }
  #hint.show { opacity: .65; }

  /* M9c: wraps (≤ 2 lines); two lines still end below the hint (bottom 86px) */
  #guide {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    padding: 7px 20px; border-radius: 22px; background: rgba(10, 22, 44, .58); box-sizing: border-box;
    width: max-content; max-width: min(80vw, 820px); text-align: center; line-height: 1.3;
    font-size: 18px; opacity: 0; transition: opacity .6s ease; will-change: opacity;
  }
  #guide.show { opacity: .96; }

  #done {
    position: absolute; bottom: 16px; right: 16px;
    font-size: 14px; padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,.45);
    background: rgba(20, 30, 50, .45); color: #fff; opacity: 0; pointer-events: none; transition: opacity .6s;
  }
  #done.show { opacity: .7; pointer-events: auto; }
  /* M8B: the temporary 「完成（測試用）」 button exists only with ?test=1 (body.test, SECTION DEBUG) */
  body:not(.test) #done { display: none !important; }

  #sliders {
    position: absolute; left: 50%; bottom: 130px; transform: translateX(-50%);
    display: none; gap: 30px; pointer-events: auto; align-items: flex-end;
  }
  #sliders.show { display: flex; }
  .slider { width: 240px; }
  .sl-label { font-size: 15px; opacity: .8; text-align: center; margin-bottom: 4px; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .sl-track { position: relative; height: 44px; touch-action: none; }
  .sl-track::before { content: ""; position: absolute; left: 0; right: 0; top: 20px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); }
  .sl-fill { position: absolute; left: 0; top: 20px; height: 4px; border-radius: 2px; background: rgba(255,240,200,.85); }
  .sl-thumb { position: absolute; top: 10px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.4); }

  /* direction dial (stage 3) */
  .dial { width: 150px; touch-action: none; }
  .dial svg { display: block; touch-action: none; }
  .dial text { font-size: 13px; fill: #fff; opacity: .85; }

  /* A10: soft frame around stage-3 controls; turns a calm pale green when that setting suits (no blinking) */
  .ctl { padding: 8px 12px 4px 12px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,.16);
    background: rgba(10,22,44,.22); transition: border-color 1.4s ease, box-shadow 1.4s ease; }
  .ctl.ok { border-color: rgba(178,226,190,.72); box-shadow: 0 0 16px rgba(178,226,190,.18); }
  /* A12: the ONE control to change next: steady soft amber frame (no blinking) + a small arrow */
  #sliders .ctl { position: relative; }
  .ctl.next { border-color: rgba(255,206,140,.8); box-shadow: 0 0 18px rgba(255,206,140,.28); }
  .ctl .nx { position: absolute; top: 2px; right: 10px; font-size: 22px; line-height: 1; color: #ffd9a0;
    opacity: 0; transition: opacity .8s ease; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .ctl .nx.l { right: auto; left: 10px; }
  .ctl.next .nx { opacity: .95; }
  /* A12: faint target band on the gait slider / direction dial (after 2 failed attempts) */
  .sl-band { position: absolute; top: 14px; height: 16px; border-radius: 8px; background: rgba(178,226,190,.30);
    opacity: 0; transition: opacity 1.2s ease; }
  .sl-band.on { opacity: 1; }
  .dial .band { fill: none; stroke: rgba(178,226,190,.42); stroke-width: 14; opacity: 0; transition: opacity 1.2s ease; }
  .dial .band.on { opacity: 1; }

  /* A12: stage-3 comparison gauge (top centre, no numbers); opacity is set by Gauge3 */
  #gauge3 { position: absolute; top: 10px; left: 50%; width: 252px; margin-left: -126px; padding: 6px 10px 8px 10px;
    border-radius: 14px; background: rgba(10,22,44,.42); text-align: center; opacity: 0; display: none;
    text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  #gauge3.show { display: block; }
  #g3Title { font-size: 14px; letter-spacing: .08em; opacity: .9; }
  #gauge3 svg { display: block; margin: 0 auto; }
  #gauge3 .arc { fill: none; stroke: rgba(255,255,255,.28); stroke-width: 2; }
  #gauge3 .tick { stroke: rgba(255,255,255,.4); stroke-width: 2; }
  #g3Wedge { fill: rgba(207,232,255,.20); transition: fill 1s ease; }
  #gauge3 .nC { stroke: #cfe8ff; stroke-width: 5; stroke-linecap: round; transition: stroke 1s ease; }
  #gauge3 .nY { stroke: #fff0d0; stroke-width: 5; stroke-linecap: round; transition: stroke 1s ease; }
  #gauge3 text { font-size: 15px; text-anchor: middle; }
  #g3LC { fill: #cfe8ff; }
  #g3LY { fill: #fff0d0; }
  #gauge3.in #g3Wedge { fill: rgba(178,226,190,.38); }
  #gauge3.in .nC, #gauge3.in .nY { stroke: #c8f0d2; }
  #g3Bars { display: flex; justify-content: space-between; margin-top: 2px; }
  #g3Bars .b { width: 72px; font-size: 12px; opacity: .9; }
  #g3Bars .t { height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); margin-top: 3px; overflow: hidden; }
  #g3Bars .t i { display: block; height: 100%; width: 0; background: rgba(255,240,200,.85); border-radius: 3px; transition: background 1s ease; }
  #g3Bars .b.ok .t i { background: #b2e2be; }
  #g3Hold { height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); margin-top: 7px; overflow: hidden; }
  #g3Hold i { display: block; height: 100%; width: 0; background: #9cffb0; }

  /* stage 6: faint animated icon (person leaning back, iPad tilting back with the body) */
  #gyroIcon {
    position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%);
    text-align: center; opacity: 0; transition: opacity 2s ease; text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  #gyroIcon.show { opacity: .6; }
  #gyroIcon svg { display: block; margin: 0 auto; filter: drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
  #gyroCap { font-size: 15px; margin-top: 2px; letter-spacing: .08em; }
  #gyroFallback { font-size: 14px; margin-top: 4px; }
  /* A14: stage 5 faint animated icon – two fingertips close, pause, open (shown after idle) */
  #pinchIcon { position: absolute; left: 50%; bottom: calc(128px * var(--k) + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    text-align: center; opacity: 0; transition: opacity 2s ease; text-shadow: 0 1px 6px rgba(0,0,0,.6); pointer-events: none; }
  #pinchIcon.show { opacity: .65; }
  #pinchIcon svg { display: block; margin: 0 auto; width: calc(176px * var(--k)); height: calc(106px * var(--k)); filter: drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
  #pinchCap { font-size: max(10px, calc(15px * var(--k))); margin-top: calc(2px * var(--k)); letter-spacing: .08em; }
  /* A11: stage 6 gyro status line + "enable gyro" button (top-left) */
  #gyroState { position: absolute; top: 16px; left: 16px; font-size: 14px; padding: 6px 12px; border-radius: 14px;
    background: rgba(10,22,44,.45); opacity: 0; transition: opacity .8s ease; }
  #gyroState.show { opacity: .8; }
  #gyroBtn { position: absolute; top: 54px; left: 16px; font-size: 16px; padding: 8px 18px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.6); background: rgba(20,30,50,.6); color: #fff; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #gyroBtn.show { opacity: .92; pointer-events: auto; }

  /* ---------- overlays outside the fading UI layer ---------- */
  #flash { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 15; overflow: hidden;
    background: radial-gradient(ellipse at center, rgba(255,252,240,.95) 0%, rgba(255,236,190,.55) 40%, rgba(255,240,210,.12) 75%, rgba(255,250,235,0) 100%);
    opacity: 0; }
  #flash.on { animation: flashPulse 1.8s ease-out forwards; }
  @keyframes flashPulse { 0% { opacity: 0; } 7% { opacity: 1; } 22% { opacity: .3; } 34% { opacity: .9; } 100% { opacity: 0; } }
  #flash::after { content: ""; position: absolute; left: 50%; top: 50%; width: 36vmin; height: 36vmin; margin: -18vmin 0 0 -18vmin;
    border-radius: 50%; border: 3px solid rgba(255,236,190,.95); box-shadow: 0 0 30px rgba(255,236,190,.8), inset 0 0 30px rgba(255,236,190,.5); opacity: 0; }
  #flash.on::after { animation: flashRing 1.5s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes flashRing { 0% { transform: scale(.25); opacity: 0; } 12% { opacity: 1; } 100% { transform: scale(2.6); opacity: 0; } }

  #release { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(4,10,24,.5) 0%, rgba(4,10,24,.18) 60%, rgba(4,10,24,0) 85%);
    opacity: 0; transition: opacity 1.6s ease; pointer-events: none; }
  #release.show { opacity: 1; }
  #release.tappable { pointer-events: auto; }
  #relTitle { font-size: 15px; letter-spacing: .35em; opacity: 0; margin-bottom: 28px; min-height: 20px;
    transition: opacity .35s ease; will-change: opacity; }
  #relTitle.in { opacity: .6; }
  #releaseText { font-size: 30px; line-height: 1.75; max-width: 78%; text-align: center; letter-spacing: .06em;
    text-shadow: 0 2px 14px rgba(0,0,0,.75); opacity: 0; transition: opacity .35s ease; will-change: opacity; }
  #releaseText.in { opacity: 1; }
  #releaseText.final { color: #ffe6b5; font-size: 34px; }
  #tapMore { margin-top: 34px; font-size: 16px; opacity: 0; transition: opacity 1.2s ease; letter-spacing: .2em; }
  #release.tappable #tapMore { opacity: .55; }

  #victory { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20; display: flex;
    align-items: center; justify-content: center; font-size: 50px; letter-spacing: .35em;
    text-shadow: 0 2px 18px rgba(0,0,0,.6); opacity: 0; transition: opacity 2.5s ease; pointer-events: none; }
  #victory.show { opacity: 1; }

  #warm { position: fixed; top: -6%; left: -6%; right: -6%; bottom: -6%; z-index: 25; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at 50% 45%, #fff0d6 0%, #f0c99a 40%, #c98f5e 80%, #9a6440 100%);
    transition: opacity 1.6s ease; }
  #warm.show { opacity: 1; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1.02) translateY(1.2%); filter: brightness(1); }
    50% { transform: scale(1.07) translateY(-1.2%); filter: brightness(1.08); }
  }

  #subtitle { position: fixed; left: 0; right: 0; bottom: 12%; z-index: 30; text-align: center;
    font-size: 30px; letter-spacing: .12em; text-shadow: 0 2px 12px rgba(0,0,0,.6);
    opacity: 0; transition: opacity .5s ease; pointer-events: none; will-change: opacity; }
  #subtitle.show { opacity: 1; }

  #white { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 40; background: #fbf8f2;
    opacity: 0; transition: opacity 2s ease; pointer-events: none; }
  #white.show { opacity: 1; }
  /* A14: end card over the soft white – 「遊戲結束，感謝遊玩」 + 「再來一次」 (reload → start screen) */
  #endCard { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 45; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: #6b4528;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    opacity: 0; transition: opacity 1.6s ease; pointer-events: none; }
  #endCard.show { opacity: 1; pointer-events: auto; }
  #endMsg { font-size: calc(34px * var(--k)); letter-spacing: .25em; margin: 0 0 calc(36px * var(--k)) 0; }
  #againBtn { font-family: inherit; font-size: max(14px, calc(22px * var(--k))); min-height: 44px; padding: calc(12px * var(--k)) calc(44px * var(--k));
    border-radius: 30px; border: 1px solid rgba(107,69,40,.5); background: rgba(255,255,255,.55); color: #6b4528;
    letter-spacing: .3em; touch-action: manipulation; }

  #start { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(rgba(8,20,45,.80), rgba(8,20,45,.93)); transition: opacity .9s ease; }
  #start.hide { opacity: 0; pointer-events: none; }
  #title { font-size: 56px; letter-spacing: .35em; margin: 0 0 18px 0; font-weight: normal; }
  #rotateNote { font-size: 18px; opacity: .8; margin: 0 0 34px 0; padding: 0 10%; text-align: center; line-height: 1.6; }
  #startBtn { font-size: 24px; padding: 14px 56px; border-radius: 32px; border: 1px solid rgba(255,255,255,.7);
    background: rgba(255,255,255,.12); color: #fff; letter-spacing: .3em; }
  #startNote { font-size: 14px; opacity: .6; margin-top: 22px; }

  #portrait { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; background: #0b1730; font-size: 26px; letter-spacing: .1em; }

  #geo { position: fixed; left: 8px; bottom: 8px; z-index: 90; display: none; white-space: pre;
    font: 12px/1.45 Menlo, monospace; color: #cfe; background: rgba(0,0,0,.6); padding: 8px; border-radius: 6px; pointer-events: none; }

  #err { position: fixed; left: 8px; right: 8px; top: 8px; z-index: 100; display: none;
    color: #ff4d4d; font: 14px/1.5 Menlo, monospace; background: rgba(0,0,0,.8); padding: 8px 10px;
    border-radius: 6px; max-height: 40%; overflow: auto; pointer-events: auto; white-space: pre-wrap; }

  /* M8: 🔈 sound toggle – bottom-left, also on the start screen; dims during 凝視 and the ending */
  #sndBtn { position: fixed; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 55; width: 46px; height: 46px; padding: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,.45);
    background: rgba(20,30,50,.45); color: #fff; font-size: 21px; line-height: 44px; text-align: center;
    opacity: .7; transition: opacity .8s ease, border-color .8s ease; touch-action: manipulation; }
  #sndBtn.on { opacity: .95; border-color: rgba(255,240,200,.8); }
  body.gazing #sndBtn { opacity: .25; }
  /* ===== M9d: ONE UI scale k = CSS --k (UI.applyScale). Every iPad: k = 1 → exactly the values above.
     max(…) keeps phone text readable; body.small = k < 1; body.short = height < 500 px ===== */
  :root { --k: 1; }
  @media (orientation: landscape) and (max-height: 599px) { :root { --k: .55; } }   /* until the script sets k */
  #hud { top: calc(16px * var(--k)); left: calc(16px * var(--k) + env(safe-area-inset-left, 0px)); width: calc(262px * var(--k));
    padding: calc(10px * var(--k)) calc(14px * var(--k)); border-radius: calc(12px * var(--k)); font-size: calc(15px * var(--k)); }
  #hud .tg { font-size: calc(12px * var(--k)); margin-left: calc(6px * var(--k)); }
  #hud .bar { height: calc(5px * var(--k)); margin: calc(2px * var(--k)) 0 calc(7px * var(--k)) 0; max-width: calc(234px * var(--k)); }
  #hud .hold { height: calc(4px * var(--k)); margin: calc(5px * var(--k)) 0 calc(6px * var(--k)) 0; }
  #hud .dist { font-size: calc(13px * var(--k)); }
  #map { top: calc(16px * var(--k)); right: calc(16px * var(--k) + env(safe-area-inset-right, 0px)); width: calc(308px * var(--k)); border-radius: calc(10px * var(--k)); }
  #map canvas { width: calc(308px * var(--k)); height: calc(150px * var(--k)); border-radius: calc(8px * var(--k)); }
  #map .lbls { font-size: max(9px, calc(12px * var(--k))); margin-top: calc(4px * var(--k)); }
  #map .lbls span { width: calc(150px * var(--k)); }
  #lastRuler { top: calc(200px * var(--k)); right: calc(16px * var(--k) + env(safe-area-inset-right, 0px)); width: calc(308px * var(--k)); font-size: calc(20px * var(--k)); }
  #toast { top: max(24%, calc(200px * var(--k))); font-size: calc(24px * var(--k)); }
  #hint { bottom: calc(86px * var(--k)); font-size: calc(26px * var(--k)); }
  #guide { bottom: calc(20px * var(--k)); padding: calc(7px * var(--k)) calc(20px * var(--k)); border-radius: calc(22px * var(--k));
    max-width: min(80vw, calc(820px * var(--k))); font-size: max(11px, calc(18px * var(--k))); }
  #sliders { bottom: calc(130px * var(--k)); gap: calc(30px * var(--k)); }
  .slider { width: calc(240px * var(--k)); }
  .sl-label { font-size: max(9px, calc(15px * var(--k))); margin-bottom: calc(4px * var(--k)); }
  .sl-track { height: max(40px, calc(44px * var(--k))); }   /* touch target ≥ 40 px; line / thumb / band stay centred */
  .sl-track::before, .sl-fill { top: calc(50% - 2px * var(--k)); height: calc(4px * var(--k)); }
  .sl-thumb { top: calc(50% - 12px * var(--k)); width: calc(24px * var(--k)); height: calc(24px * var(--k)); margin-left: calc(-12px * var(--k)); }
  .sl-band { top: calc(50% - 8px * var(--k)); height: calc(16px * var(--k)); border-radius: calc(8px * var(--k)); }
  .dial, .dial svg { width: calc(150px * var(--k)); }

<script>
/* ---- early error overlay (part of SECTION DEBUG; classic script so that even loading errors show) ---- */
(function () {
  var box = null, count = 0;
  function show(msg) {
    if (!box) box = document.getElementById('err');
    if (!box) { setTimeout(function () { show(msg); }, 60); return; }
    if (count > 12) return;
    count++;
    box.style.display = 'block';
    var line = document.createElement('div');
    line.textContent = '⚠ ' + msg;
    box.appendChild(line);
  }
  window.__showErr = show;
  window.addEventListener('error', function (e) {
    var where = e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + e.lineno : '';
    show((e.message || 'Error') + where);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    show('Promise: ' + (r && r.message ? r.message : String(r)));
  });
  setTimeout(function () {
    if (!window.__booted) show('程式未能載入（可能是網絡問題，或 Safari 版本太舊）。請重新整理頁面。');
  }, 20000);
})();
</script>

// helpers
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const rad = (d) => d * Math.PI / 180;
const deg = (r) => r * 180 / Math.PI;
const wrapA = (a) => Math.atan2(Math.sin(a), Math.cos(a));   // angle → (−π, π]
const $ = (id) => document.getElementById(id);
function thetaDeg(width, dist) { return deg(2 * Math.atan(width / (2 * dist))); }
function rng(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}

// ==== SECTION: DEBUG ====

// The red on-screen error overlay is installed by the early classic script in <head>.
// URL options:  ?stage=N (1–6) jump to stage N   ?stage=end play ending
//               ?eye=0.3 force eye height   ?geo=1 show geometry numbers (stage 6: + live gyro readings)
//               ?q=low lighter grass/fur/cloud (old iPads; automatic on phones)   ?q=high full quality, also on phones
//               ?walk=1 斄牛 walks slowly in place (to check the walk animation)
//               ?test=1 teacher shortcut: shows the 「完成（測試用）」 button (never visible otherwise)
const params = new URLSearchParams(location.search);
// M9e: phone = short screen side < 600 px (every iPad ≥ 600, also iPad mini) → ?q=low settings automatically
const isPhone = Math.min(screen.width || window.innerWidth, screen.height || window.innerHeight) < 600;
const DEBUG = {
  stageParam: (params.get('stage') || '').toLowerCase(),
  eyeOverride: params.has('eye') ? parseFloat(params.get('eye')) : null,
  geo: params.get('geo') === '1',
  lowQ: params.get('q') === 'low' || (isPhone && params.get('q') !== 'high'),
  walk: params.get('walk') === '1',
  test: params.get('test') === '1',
  geoLines: [],
  err(msg) { if (window.__showErr) window.__showErr(msg); else console.error(msg); },
  startStage() {
    if (this.stageParam === 'end') return 'end';
    const n = parseInt(this.stageParam, 10);
    return (n >= 1 && n <= 6) ? n : 1;
  },
  info(lines) { const el = $('geo'); el.style.display = 'block'; el.textContent = lines.join('\n'); }
};
if (DEBUG.test) document.body.classList.add('test');   // CSS: without body.test the 完成 button is never shown
if (DEBUG.eyeOverride !== null && !(DEBUG.eyeOverride > 0)) DEBUG.eyeOverride = null;
if (DEBUG.lowQ) {
  CONFIG.grass.tufts = Math.round(CONFIG.grass.tufts * 0.45);
  CONFIG.yak.furShells = 6; CONFIG.yak.skirtShells = 4;
  CONFIG.cloud.puffs = Math.round(CONFIG.cloud.puffs * 0.6);
}

// A10: rough fraction of the stage-3 standing frame covered by cloud (ray grid vs. every puff disc, above its base)
function cloudCover() {
  const cam = new THREE.PerspectiveCamera(CONFIG.fov, camera.aspect, 1, 50000);
  cam.position.set(0, groundH(0, 0) + CONFIG.eyeStand, 0);
  cam.rotation.set(rad(CONFIG.basePitchDeg), rad(CONFIG.baseYawDeg), 0, 'YXZ');
  cam.updateMatrixWorld(true);
  const pts = [], v = new THREE.Vector3(), dir = new THREE.Vector3();
  Cloud.list.forEach((c) => {
    c.mesh.updateMatrixWorld(true);
    const base = c.mesh.position.y - c.H / 2 - cam.position.y;
    c.P.forEach((p) => {
      v.set(p.x, p.y, p.z); c.mesh.localToWorld(v); v.sub(cam.position);
      const d = v.length();
      pts.push({ x: v.x / d, y: v.y / d, z: v.z / d, d, c: Math.cos(Math.asin(Math.min(1, 0.9 * p.R / d))), base });
    });
  });
  const NX = 48, NY = 36;
  let hit = 0;
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    dir.set((i + 0.5) / NX * 2 - 1, (j + 0.5) / NY * 2 - 1, 0.5).unproject(cam).sub(cam.position).normalize();
    for (const p of pts) {
      if (dir.x * p.x + dir.y * p.y + dir.z * p.z > p.c && dir.y * p.d > p.base) { hit++; break; }
    }
  }
  return hit / (NX * NY);
}

function verifyGeometry() {
  const Y = CONFIG.yak, T = CONFIG.terrain, lines = [], fails = [];
  const gy = groundH(Y.s, Y.x), g0 = groundH(0, 0);
  const cut = (e, grass) => (g0 + e) + horizonSlope(e, 0, Y.s - 0.6, grass) * Y.s - gy;
  const hs = cut(CONFIG.eyeStand, false), hsG = cut(CONFIG.eyeStand, true);
  const hl = cut(CONFIG.eyeLie, false), hlG = cut(CONFIG.eyeLie, true);
  const visL = (Y.top - hlG) / Y.top;
  lines.push(`斄牛地面 ${gy.toFixed(3)} m（山脊 ${T.crestH} m 於 ${T.crestS} m；觀者地面 ${g0} m）`);
  lines.push(`站立：遮住 ${hs.toFixed(3)} m（連草 ${hsG.toFixed(3)} m）`);
  lines.push(`躺下：遮住 ${hl.toFixed(3)} m（連草 ${hlG.toFixed(3)} m），可見 ${(visL * 100).toFixed(1)}%`);
  if (!(hs >= Y.hoof)) fails.push('站立時山脊應遮住蹄');                        // M9a: standing: hooves hidden
  if (!(hl >= Y.skirtHem && hl <= Y.skirtTop)) fails.push('躺下時應切在裙毛高度');
  if (!(visL >= 0.7)) fails.push('躺下時斄牛可見部分少於 70%');
  // M9a: ending walk (same pose as Ending.update): hooves on the ground, the skirt hem never touches the ground
  let gapMin = Infinity, liftMax = 0;
  for (let t = 0; t <= CONFIG.ending.walk[1] + 0.5; t += 0.05) {
    const w = Ending.walkAt(t), P = Ending.slopePose(Y.x, w.s, w.yaw), Q = Ending.slopePose(Y.x, w.s, w.yaw, 64);
    gapMin = Math.min(gapMin, P.y - Q.need); liftMax = Math.max(liftMax, P.lift);
  }
  const H0 = Ending.slopePose(Y.x, Y.s, 0, 64);
  lines.push(`裙毛下緣 ${Y.skirtHem} m（±${Y.skirtRag}）：預設位置離地 ${H0.gap.toFixed(3)} m；` +
    `結局走近：裙毛離地最少 ${gapMin.toFixed(3)} m，蹄最多離地 ${liftMax.toFixed(3)} m`);
  if (!(H0.lift < 0.001)) fails.push('預設位置：裙毛碰到地面');
  if (!(gapMin > 0 && liftMax <= 0.06)) fails.push('結局：斄牛應踏在地上，裙毛不可插入地面');
  // stage 3: start spot mostly hidden behind the crest, "risen" spot mostly visible (standing, with grass)

  const S3 = CONFIG.stage3;
  const cutAt = (sp, e, grass) => (g0 + e) + horizonSlope(e, 0, sp - 0.6, grass) * sp - groundH(sp, 0);
  const v0 = (Y.top - cutAt(S3.startS, CONFIG.eyeStand, true)) / Y.top;
  const v1 = (Y.top - cutAt(S3.riseS, CONFIG.eyeStand, true)) / Y.top;
  lines.push(`第三關：起點可見 ${(v0 * 100).toFixed(1)}%，升起後可見 ${(v1 * 100).toFixed(1)}%`);
  if (!(v0 > 0.2 && v0 < 0.6)) fails.push('第三關起點：斄牛應大半藏在山脊後');
  if (!(v1 >= 0.7)) fails.push('第三關：升起後斄牛應大部分可見');
  // A12: OK zone of the stage-3 controls at min / default / max wind (model at refD, same rule as the live check)
  const zs = [0, S3.defaultWind, 1].map((w) => STAGES[3].zone(w)), j3 = (f) => zs.map(f).join('/');
  lines.push(`第三關合適範圍（風 小/中/大）：理想圓盤 ${j3((z) => (z.uI * 90).toFixed(0))}°・理想步速 ${j3((z) => (z.gI * 100).toFixed(0))}%・` +
    `圓盤寬 ${j3((z) => z.dW.toFixed(0))}°・步速寬 ${j3((z) => (z.gW * 100).toFixed(0))}%`);
  if (zs.some((z) => z.dW < S3.zoneMinDeg)) fails.push(`第三關：圓盤合適範圍應 ≥ ${S3.zoneMinDeg}°`);
  if (zs.some((z) => z.gW < S3.zoneMinGait)) fails.push(`第三關：步速合適範圍應 ≥ ${Math.round(S3.zoneMinGait * 100)}%`);
  let mOK = 0;
  World.mountains.forEach((mt) => {
    const sS = horizonSlope(CONFIG.eyeStand, mt.bearing, 150, true);
    const sL = horizonSlope(CONFIG.eyeLie, mt.bearing, 150, false);
    const pS = (mt.peakY - g0 - CONFIG.eyeStand) / mt.dist;
    const pL = (mt.peakY - g0 - CONFIG.eyeLie) / mt.dist;
    if (pS > sS && pL < sL) mOK++; else fails.push(`遠山 ${mt.i}：應站立可見、躺下被遮`);
  });
  lines.push(`遠山 ${mOK}/${World.mountains.length} 符合（站立可見、躺下被遮）`);
  const C = CONFIG.cloud;
  const cb = (C.centerY - C.height / 2 - g0 - CONFIG.eyeLie) / C.dist;
  const cl = horizonSlope(CONFIG.eyeLie, rad(C.bearingDeg), 150, true);
  lines.push(`大雲底 ${deg(Math.atan(cb)).toFixed(1)}°，躺下山脊 ${deg(Math.atan(cl)).toFixed(1)}°`);
  if (!(cb > cl)) fails.push('躺下時大雲被山脊遮住');
  const eyeY = g0 + CONFIG.eyeStand;
  const dy = Math.hypot(Y.s, gy + Y.mid - eyeY);
  const dc = Math.hypot(C.dist, C.centerY - eyeY);
  const ty = thetaDeg(Y.length, dy), tc = thetaDeg(C.width, dc), r = ty / tc;
  lines.push(`θ斄牛 ${ty.toFixed(2)}°  θ雲 ${tc.toFixed(2)}°  比例 ${r.toFixed(3)}`);
  if (r < CONFIG.sizeWindow[0] || r > CONFIG.sizeWindow[1]) fails.push('預設距離時大小比例不在窗口內');
  // A10: background cumulonimbus + cloud cover estimate (information only)
  let bMin = 90, tMax = 0;
  CONFIG.bgClouds.forEach((e) => {
    bMin = Math.min(bMin, deg(Math.atan((e[2] - eyeY) / e[1])));
    tMax = Math.max(tMax, deg(Math.atan((e[2] + e[4] - eyeY) / e[1])));
  });
  lines.push(`背景積雨雲 ${CONFIG.bgClouds.length} 座：雲底最低 ${bMin.toFixed(1)}°，雲頂最高 ${tMax.toFixed(1)}°`);
  lines.push(`雲量（第三關視野估算）：約 ${(cloudCover() * 100).toFixed(0)}%（目標約 50%）`);
  // stage 4: shadow contrast default → success threshold (lower = softer); sun never off → shadow remains
  const S4 = CONFIG.stage4;
  const c0 = Lighting.contrastOf(S4.defaultSky, S4.defaultBounce), c1 = Lighting.contrastOf(S4.skyOK, S4.bounceOK);
  lines.push(`第四關：影子對比 ${c0.toFixed(2)} → 成功時 ≤ ${c1.toFixed(2)}`);
  if (!(c1 < c0 * 0.8 && c1 > 0.15)) fails.push('第四關：影子應變淡但不消失');
  // stage 5: foreground blades stay below the standing sight line over the crest
  const slS = horizonSlope(CONFIG.eyeStand, 0, Y.s - 0.6, true);
  let fMargin = Infinity;
  Grass.foreList.forEach((f) => { fMargin = Math.min(fMargin, eyeY + slS * f.s - f.top); });
  lines.push(`第五關：近景長草最高處低於視線 ${fMargin.toFixed(2)} m`);
  if (!(fMargin > 0.1)) fails.push('第五關：近景長草擋住了斄牛');
  // stage 6: lying with the camera pitched up (max +10°) → frame still shows the crest, the 斄牛 top and the cloud top
  const half = CONFIG.fov / 2, pL6 = CONFIG.basePitchDeg + CONFIG.gyro.maxPitchUpDeg;
  const crestL6 = deg(Math.atan(horizonSlope(CONFIG.eyeLie, 0, Y.s - 0.6, true)));
  const topL6 = deg(Math.atan((gy + Y.top - g0 - CONFIG.eyeLie) / Y.s));
  const cTopL6 = deg(Math.atan((C.centerY + C.height / 2 - g0 - CONFIG.eyeLie) / C.dist));
  lines.push(`第六關（躺下，仰 +${CONFIG.gyro.maxPitchUpDeg}°）：畫面 ${(pL6 - half).toFixed(1)}° 至 ${(pL6 + half).toFixed(1)}°；` +
    `山脊 ${crestL6.toFixed(1)}°、斄牛頂 ${topL6.toFixed(1)}°、大雲頂 ${cTopL6.toFixed(1)}°`);
  if (!(pL6 - half < crestL6 && topL6 < pL6 + half && cTopL6 < pL6 + half)) fails.push('第六關：躺下時畫面應同時看到山脊、斄牛與大雲');
  // M9b: half-closed eyes (lid base + drift, narrowest iPad 4:3, lying view ± breathing pitch): the lower lid stays
  // below the crest line where it cuts the 斄牛; the 斄牛 top and the big cloud top stay inside the opening
  const BL = CONFIG.blink, lidHi = BL.base + BL.drift, sw6 = CONFIG.gaze.swayPitchDeg;
  const cam6 = new THREE.PerspectiveCamera(CONFIG.fov, 4 / 3, 0.05, 40000), q6 = new THREE.Vector3();
  cam6.position.set(0, g0 + CONFIG.eyeLie, 0);
  const uv6 = (x, y, z, p) => {
    cam6.rotation.set(rad(p), rad(CONFIG.baseYawDeg), 0, 'YXZ'); cam6.updateMatrixWorld(true);
    q6.set(x, y, z).project(cam6); return { y: (q6.y + 1) / 2, e: Eyes.edges(lidHi, q6.x) };
  };
  let lowM = Infinity, topM = Infinity;
  [-0.5, 0, 0.5].forEach((f) => { const a = uv6(Y.x + f * Y.length, gy + hlG, -Y.s, pL6 + sw6); lowM = Math.min(lowM, a.y - a.e.bot); });
  const cb6 = rad(C.bearingDeg);
  [uv6(Y.x, gy + Y.top, -Y.s, pL6 - sw6), uv6(C.dist * Math.sin(cb6), C.centerY + C.height / 2, -C.dist * Math.cos(cb6), pL6 - sw6)]
    .forEach((a) => { topM = Math.min(topM, a.e.top - a.y); });
  lines.push(`半閉眼（眼皮 ${BL.base}±${BL.drift}）：下眼皮低於山脊 ${(lowM * 100).toFixed(1)}%、斄牛頂／大雲頂在眼縫內 ${(topM * 100).toFixed(1)}%（畫面高度）`);
  if (!(lowM > 0 && topM > 0)) fails.push('半閉眼：下眼皮應低於山脊，斄牛頂與大雲應在眼縫內');

  if (fails.length && (DEBUG.test || DEBUG.geo)) DEBUG.err('幾何檢查：' + fails.join('；'));

// Camera rig: main view is ALWAYS first person from the observer's eye.
const Rig = { d: CONFIG.yak.s, eye: 1.6, pitchAdd: 0, sway: 0, swayT: 0, override: null, yAdd: 0, pitchFx: 0, rollAdd: 0 };
const _qA = new THREE.Quaternion(), _qB = new THREE.Quaternion(), _m4 = new THREE.Matrix4();
const _eu = new THREE.Euler(0, 0, 0, 'YXZ'), _up = new THREE.Vector3(0, 1, 0);
const SWAY_STATES = ['gaze', 'release', 'transition', 'synth', 'victory'];
function obsS() { return CONFIG.yak.s - Rig.d; }   // observer position along s
// M9e: phones report the final size late (rotation, toolbar shows / hides) → measure again a little later
const _rz = { w: 0, h: 0, t: 0 };
function resizeLater() { clearTimeout(_rz.t); _rz.t = setTimeout(onResize, 350); }
window.addEventListener('resize', resizeLater);
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { onResize(); resizeLater(); });

function updateCamera(dt) {
  const G = CONFIG.gaze;
  const want = SWAY_STATES.includes(Flow.state) ? 1 : 0;
  Rig.sway += (want - Rig.sway) * Math.min(1, dt * 1.2);
  Rig.swayT += dt;
  const s = obsS();
  const eye = (DEBUG.eyeOverride !== null) ? DEBUG.eyeOverride : Rig.eye;
  let y = groundH(s, 0) + eye + Rig.yAdd;                       // A11: + landing dip / breathing (stage 6)
   let pitch = CONFIG.basePitchDeg + Rig.pitchAdd + Rig.pitchFx, yaw = CONFIG.baseYawDeg, roll = Rig.rollAdd;

  if (Rig.sway > 0.001) {   // gentle breathing sway
    const w = Rig.swayT * 2 * Math.PI / G.period;
    y += Rig.sway * G.swayY * Math.sin(w);
    pitch += Rig.sway * G.swayPitchDeg * Math.sin(w - 0.6);
    roll += Rig.sway * G.swayRollDeg * Math.sin(w * 0.5);
  }
  _eu.set(rad(pitch), rad(yaw), rad(roll), 'YXZ');
  if (Rig.override) {
    const o = Rig.override;
    camera.position.copy(o.pos);
    _qA.setFromEuler(_eu);
    _m4.lookAt(o.pos, o.look, _up);
    _qB.setFromRotationMatrix(_m4);
    camera.quaternion.slerpQuaternions(_qA, _qB, o.w);
  } else {
    camera.position.set(0, y, -s);
    camera.quaternion.setFromEuler(_eu);
  }
}

}

// Ground height. s = forward distance (world z = −s), x = sideways.
function groundH(s, x = 0) {
  const T = CONFIG.terrain;
  if (s <= 0) return Math.max(0, T.g0 * (1 + s / T.backLen));
  const lat = T.lateralAmp * Math.sin(x / T.lateralWave) * Math.min(1, Math.abs(x) / 40);
  const H = T.crestH + lat;
  if (s <= T.crestS) {
    const t = s / T.crestS;
    return T.g0 + (H - T.g0) * (T.nearLin * t + (1 - T.nearLin) * t * t);
  }
  const d = s - T.crestS;
  return Math.max(T.lowY, H - T.farK1 * d - T.farK2 * d * d);
}

// Max elevation slope (tan) of the ground (optionally + grass tips) seen from the eye along a bearing.
function horizonSlope(eyeH, bearing, rMax, withGrass) {
  const eyeY = groundH(0, 0) + eyeH;
  const cb = Math.cos(bearing), sb = Math.sin(bearing);
  let m = -Infinity;
  for (let i = 10; ; i++) {
    const r = i * 0.05;
    if (r > rMax) break;
    const s = r * cb, x = r * sb;
    if (s > CONFIG.terrain.sMax) break;
    const h = groundH(s, x) + (withGrass ? Grass.cap(s) : 0);
    const sl = (h - eyeY) / r;
    if (sl > m) m = sl;
  }
  return m;
}

function makeGroundTexture() {
  const N = 512, cv = document.createElement('canvas');
  cv.width = cv.height = N;
  const ctx = cv.getContext('2d'), rnd = rng(777);
  ctx.fillStyle = '#86924a';
  ctx.fillRect(0, 0, N, N);
  const wrap = (x, y, r, fn) => {
    for (let ox = -N; ox <= N; ox += N) for (let oy = -N; oy <= N; oy += N) {
      if (x + ox + r < 0 || x + ox - r > N || y + oy + r < 0 || y + oy - r > N) continue;
      fn(x + ox, y + oy);
    }
  };
  const blot = ['#9aa356', '#74813d', '#a99b5c', '#66743a', '#8e8a4c'];
  for (let i = 0; i < 160; i++) {
    const x = rnd() * N, y = rnd() * N, r = 18 + rnd() * 60, c = blot[Math.floor(rnd() * blot.length)];
    ctx.globalAlpha = 0.35;
    wrap(x, y, r, (px, py) => {
      const g = ctx.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, c); g.addColorStop(1, c + '00');
      ctx.fillStyle = g; ctx.fillRect(px - r, py - r, 2 * r, 2 * r);
    });
  }
  ctx.lineCap = 'round';
  const strokes = ['#a7ad5e', '#c2b46a', '#6b7a36', '#57652e', '#b9b778', '#7f8c43'];
  for (let i = 0; i < 7000; i++) {
    const x = rnd() * N, y = rnd() * N, l = 3 + rnd() * 7, a = -Math.PI / 2 + (rnd() - 0.5) * 1.2;
    const ex = Math.cos(a) * l, ey = Math.sin(a) * l;
    ctx.globalAlpha = 0.35 + rnd() * 0.4;
    ctx.strokeStyle = strokes[Math.floor(rnd() * strokes.length)];
    ctx.lineWidth = 0.8 + rnd() * 1.2;
    wrap(x, y, 12, (px, py) => { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + ex, py + ey); ctx.stroke(); });
  }
  ctx.fillStyle = '#5a4a32';
  for (let i = 0; i < 400; i++) {
    const x = rnd() * N, y = rnd() * N, r = 0.6 + rnd() * 1.6;
    ctx.globalAlpha = 0.3 + rnd() * 0.3;
    wrap(x, y, r, (px, py) => { ctx.beginPath(); ctx.arc(px, py, r, 0, 6.283); ctx.fill(); });
  }
  ctx.globalAlpha = 1;
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

const World = {
  sky: null, terrain: null, mountains: [], mtGroup: null, refs: [], refHome: [], refFoot: [],
  build() {
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
      uniforms: {
        top: { value: new THREE.Color(CONFIG.sky.top) },
        hor: { value: new THREE.Color(CONFIG.sky.horizon) }
      },
      vertexShader: `
        varying vec3 vDir;
        void main() {
          vDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform vec3 top;
        uniform vec3 hor;
        varying vec3 vDir;
        void main() {
          float h = clamp(vDir.y, 0.0, 1.0);
          float k = pow(h, 0.45);
          vec3 c = mix(hor, top, k);
          gl_FragColor = vec4(c, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`
    });
    this.sky = new THREE.Mesh(new THREE.SphereGeometry(35000, 32, 16), skyMat);
    this.sky.renderOrder = -1000;
    this.sky.frustumCulled = false;
    scene.add(this.sky);
    this.buildTerrain();
    this.buildMountains();
    this.buildRefs();
  },

  buildTerrain() {
    const T = CONFIG.terrain;
    const sv = [];
    const push = (a, b, st) => { for (let v = a; v < b - 1e-6; v += st) sv.push(+v.toFixed(4)); };
    push(T.sMin, -40, 4); push(-40, 0, 1); push(0, 14, 0.15); push(14, 60, 1); push(60, T.sMax + 0.001, 4);
    sv.push(T.crestS, T.sMax);            // the crest is an exact vertex row
    const sArr = [...new Set(sv)].sort((a, b) => a - b);
    const xv = [];
    const pushx = (a, b, st) => { for (let v = a; v < b - 1e-6; v += st) xv.push(+v.toFixed(3)); };
    const W = T.width / 2;
    pushx(-W, -60, 20); pushx(-60, -25, 3); pushx(-25, 25, 0.5); pushx(25, 60, 3); pushx(60, W + 0.001, 20);
    xv.push(W);
    const xArr = [...new Set(xv)].sort((a, b) => a - b);
    const ns = sArr.length, nx = xArr.length;
    const pos = new Float32Array(ns * nx * 3), col = new Float32Array(ns * nx * 3), uv = new Float32Array(ns * nx * 2);
    let k = 0, u = 0;
    for (let i = 0; i < ns; i++) {
      const s = sArr[i];
      for (let j = 0; j < nx; j++) {
        const x = xArr[j];
        pos[k] = x; pos[k + 1] = groundH(s, x); pos[k + 2] = -s;
        const n1 = 0.5 + 0.5 * Math.sin(x * 0.21 + s * 0.13) * Math.sin(x * 0.05 - s * 0.17);
        const n2 = 0.5 + 0.5 * Math.sin(x * 0.7 + s * 0.9);
        const v = 0.82 + 0.2 * n1 + 0.06 * n2;
        col[k] = v; col[k + 1] = v * (0.98 + 0.04 * n2); col[k + 2] = v * 0.95;
        uv[u] = x / 2.5; uv[u + 1] = s / 2.5;
        k += 3; u += 2;
      }
    }
    const idx = [];
    for (let i = 0; i < ns - 1; i++) {
      for (let j = 0; j < nx - 1; j++) {
        const a = i * nx + j, b = (i + 1) * nx + j, c = i * nx + j + 1, d = (i + 1) * nx + j + 1;
        idx.push(a, c, b, c, d, b);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ map: makeGroundTexture(), vertexColors: true, roughness: 1, metalness: 0, side: THREE.DoubleSide });
    this.terrain = new THREE.Mesh(geo, mat);
    this.terrain.receiveShadow = true;
    scene.add(this.terrain);
    const low = new THREE.Mesh(new THREE.CircleGeometry(30000, 48),
      new THREE.MeshStandardMaterial({ color: 0x8a8058, roughness: 1 }));
    low.rotation.x = -Math.PI / 2;
    low.position.y = T.lowY;
    scene.add(low);
  },

  buildMountains() {
    const M = CONFIG.mountains, T = CONFIG.terrain, rnd = rng(12345), g0 = groundH(0, 0);
    this.mtGroup = new THREE.Group();
    scene.add(this.mtGroup);
    const rock = new THREE.MeshStandardMaterial({ color: 0x8a97ad, roughness: 1, flatShading: true });
    const snow = new THREE.MeshStandardMaterial({ color: 0xf3f5f9, roughness: 0.9, flatShading: true });
    for (let i = 0; i < M.count; i++) {
      const b = rad(lerp(M.minBearing, M.maxBearing, (i + 0.2 + rnd() * 0.6) / M.count));
      const dist = lerp(M.minDist, M.maxDist, rnd());
      const sS = horizonSlope(CONFIG.eyeStand, b, 150, true);
      const sL = horizonSlope(CONFIG.eyeLie, b, 150, false);
      const lo = g0 + CONFIG.eyeStand + dist * sS;   // lowest peak still visible when standing
      const hi = g0 + CONFIG.eyeLie + dist * sL;     // highest peak still hidden when lying
      const peakY = lerp(lo, hi, lerp(M.tMin, M.tMax, rnd()));
      const h = peakY - T.lowY, R = h * (1.8 + rnd() * 1.4);
      const x = dist * Math.sin(b), z = -dist * Math.cos(b), ry = rnd() * 6.28;
      const cone = new THREE.Mesh(new THREE.ConeGeometry(R, h, 7, 1), rock);
      cone.position.set(x, T.lowY + h / 2, z);
      cone.rotation.y = ry;
      this.mtGroup.add(cone);
      const sh = h * 0.26;
      const cap = new THREE.Mesh(new THREE.ConeGeometry(R * 0.26 * 1.05, sh, 7, 1), snow);
      cap.position.set(x, peakY - sh / 2, z);
      cap.rotation.y = ry;
      this.mtGroup.add(cap);
      this.mountains.push({ i, bearing: b, dist, peakY, x, z, R });
    }
  },

  buildRefs() {
    const M = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 });
    const sh = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };
    const box = (w, h, d, c, y) => { const m = sh(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c))); m.position.y = y; return m; };
    const mk = (name, s, x, parts, foot) => {
      const g = new THREE.Group();
      parts.forEach((p) => g.add(p));
      g.position.set(x, groundH(s, x), -s);
      g.name = name;
      scene.add(g);
      this.refs.push(g);
      this.refHome.push(g.position.clone());
      this.refFoot.push({ x: x + (foot[2] || 0), s, w: foot[0], d: foot[1] });
    };
    // ORDER matters (stage 1 swipes them away in this order, then the mountains): tree, fence, barn, tent, flags
    const c1 = sh(new THREE.Mesh(new THREE.ConeGeometry(1.7, 3.4, 9), M(0x35592e))); c1.position.y = 3.0;
    const c2 = sh(new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.6, 9), M(0x3d6634))); c2.position.y = 4.8;
    mk('tree', 2, -11, [box(0.35, 2.2, 0.35, 0x5a4030, 1.1), c1, c2], [3.4, 3.4]);
    const fence = [];
    for (let i = 0; i < 6; i++) { const p = box(0.12, 1.2, 0.12, 0x7a6448, 0.6); p.position.x = -2.75 + i * 1.1; fence.push(p); }
    fence.push(box(5.7, 0.08, 0.06, 0x7a6448, 0.55), box(5.7, 0.08, 0.06, 0x7a6448, 1.05));
    mk('fence', 7, 6, fence, [5.7, 0.2]);
    const roof = sh(new THREE.Mesh(new THREE.ConeGeometry(4.4, 2.2, 4), M(0x5b2a22)));
    roof.position.y = 5.1; roof.rotation.y = Math.PI / 4;
    mk('barn', 3, 16, [box(6, 4, 5, 0x8e3b2d, 2), roof], [6, 5]);
    const tent = sh(new THREE.Mesh(new THREE.ConeGeometry(2.3, 2.3, 4), M(0x3a2f28)));
    tent.position.y = 1.15; tent.rotation.y = Math.PI / 4;
    const door = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 1.0), M(0x1c1612));
    door.position.set(0, 0.5, 1.2); door.rotation.x = -0.45;
    mk('tent', 4.5, -6, [tent, door], [3.3, 3.3]);
    const flags = [box(0.06, 3.2, 0.06, 0x6b5a46, 1.6)];
    const pB = box(0.06, 3.2, 0.06, 0x6b5a46, 1.6); pB.position.x = -3.6; flags.push(pB);
    const fc = [0x2f6fd6, 0xf5f5f0, 0xd23b32, 0x2f9a4a, 0xf2c230];
    for (let i = 0; i < 11; i++) {
      const t = (i + 0.5) / 11;
      const f = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.24), new THREE.MeshStandardMaterial({ color: fc[i % 5], roughness: 0.8, side: THREE.DoubleSide }));
      f.position.set(-3.6 * t, 3.05 - 0.55 * Math.sin(Math.PI * t) - 0.12, 0);
      f.castShadow = true;

      fired = true; el.removeEventListener('transitionend', end); change();
    };
    el.addEventListener('transitionend', end);
    setTimeout(end, (fs + 0.1) * 1000);
  },
  showHint(t) { this.swapText(this.hint, t); },
  allowGuide() { this.guideAllowed = true; this.guideText(this.guideMsg, true); },
  guideText(t, force) {
    if (t === this.guideMsg && !force) return;
    this.guideMsg = t;
    this.swapText(this.guideEl, t && this.guideAllowed ? t : null);
  },
  toast(t) {
    const id = ++this._toastT;
    this.swapText(this.toastEl, t, { onIn: () => setTimeout(() => { if (id === this._toastT) this.swapText(this.toastEl, null); }, 2600) });
  },
  setDone(on) { this.done.classList.toggle('show', on); },
  setMap(on) { this.mapOn = on; this.map.classList.toggle('show', on); Minimap.visible = on; },
  setHud(on) { this.hudOn = on; this.hud.classList.toggle('show', on); document.body.classList.toggle('hud2', !!on); if (on) this.updateHud(true); },
  updateHud(force) {
    if (!this.hudOn) return;
    if ((this._hudTick++ % 5) && !force) return;
    const m = Measure.compute(), w = CONFIG.sizeWindow, k = this.k || 1;   // M9d: bar lengths follow the UI scale
    const ok = m.ratio >= w[0] && m.ratio <= w[1];
    const U = TEXT.ui;
    this.hud.innerHTML =
      `<div class="row"><span>${U.hudYak}</span><b>${m.ty.toFixed(2)}°</b></div>` +
      `<div class="bar y" style="width:${(Math.min(234, m.ty * 9) * k).toFixed(0)}px"></div>` +
      `<div class="row"><span>${U.hudCloud}</span><b>${m.tc.toFixed(2)}°</b></div>` +
      `<div class="bar c" style="width:${(Math.min(234, m.tc * 9) * k).toFixed(0)}px"></div>` +
      `<div class="row ${ok ? 'ok' : ''}"><span>${U.hudRatio}</span><span><b>${m.ratio.toFixed(2)}</b><span class="tg">${U.hudTarget} ${w[0].toFixed(2)}–${w[1].toFixed(2)}</span></span></div>` +
      `<div class="hold"><i style="width:${(this.holdK * 100).toFixed(0)}%"></i></div>` +
      `<div class="dist">${U.hudDistYak} ${m.dy.toFixed(1)} m ・ ${U.hudDistCloud} ${(m.dc / 1000).toFixed(1)} km</div>`;
  },
  resizeBrackets() {
    this.applyScale();   // M9d: UI scale first (UI.init + onResize = resize / orientation change)
    if (!this.brk) return;
    this.bdpr = Math.min(window.devicePixelRatio || 1, 2);
    this.brk.width = Math.round(window.innerWidth * this.bdpr);
    this.brk.height = Math.round(window.innerHeight * this.bdpr);
  },
  // M9d: ONE UI scale k → CSS --k (+ body.small when k < 1, body.short when the screen is < 500 px high).
  // Teacher option C: short side ≥ 600 px (every iPad, also iPad mini in Safari) → k = 1, exactly as before.
  applyScale() {
    const w = window.innerWidth, h = window.innerHeight;
    this.k = Math.min(w, h) >= 600 ? 1 : clamp(Math.min(w / 1024, h / 720), 0.55, 1);
    document.documentElement.style.setProperty('--k', this.k.toFixed(3));

    document.body.classList.toggle('short', h < 500);
  },
  // Angular-width brackets drawn over 斄牛 and cloud (stage 2 only, part of the HUD)
  drawBrackets() {
    const ctx = this.bctx, c = this.brk;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, c.width, c.height);
    if (!this.hudOn) return;
    ctx.setTransform(this.bdpr, 0, 0, this.bdpr, 0, 0);
    const W = window.innerWidth, H = window.innerHeight, m = Measure.compute(), Y = CONFIG.yak, p = Yak.group.position;
    const P = (x, y, z) => { _bv.set(x, y, z).project(camera); return _bv.z < 1 ? { x: (_bv.x + 1) / 2 * W, y: (1 - _bv.y) / 2 * H } : null; };
    const yT = p.y + Y.top + 0.3;
    this.bracket(ctx, P(p.x - Y.length / 2, yT, p.z), P(p.x + Y.length / 2, yT, p.z), '#ffb347', `${TEXT.ui.hudYak} ${m.ty.toFixed(1)}°`);
    const cp = Cloud.mesh.position, C = CONFIG.cloud, cam = camera.position;
    const dx = cp.x - cam.x, dz = cp.z - cam.z, L = Math.hypot(dx, dz);

  },
  bracket(ctx, a, b, col, label) {

  },
  showLastRuler(on) {

  },

  // defs: [{ label, v, on, type?: 'dial', ends?: [a, b], frame?: true }] – sliders (default) or a direction dial;
  // frame = soft border that can turn pale green (A10, see ctlOK)

    // the pause between two lines is only the fade-out; after the last line onDone runs once it is fully transparent
    let i = 0;

  subtitle(t) { this.swapText(this.sub, t); },   // M9c: null = fade out; a new line waits until the old one is gone

white(on) { this.whiteEl.classList.toggle('show', on); },

};

  },
  rot(w) { const G = CONFIG.stage3.gauge; return Math.sign(w) * Math.sqrt(Math.min(1, Math.abs(w) / G.fullDeg)) * G.maxRot; },
  xy(r, a) { const t = rad(a); return [r * Math.sin(t), -r * Math.cos(t)]; },
  pt(r, a) { const p = this.xy(r, a); return p[0].toFixed(1) + ' ' + p[1].toFixed(1); },
  label(el, r, a) { const p = this.xy(r, a); el.setAttribute('x', p[0].toFixed(1)); el.setAttribute('y', (p[1] + 5).toFixed(1)); },
  // s: { c, y, lo, hi (signed °/s), inW, fills[3] 0…1, oks[3], hold 0…1 }
  update(s, dt) {
    if (!this.on) return;
    const G = CONFIG.stage3.gauge, k = 1 - Math.exp(-dt / G.tau), kc = 1 - Math.exp(-dt / G.cTau);
    this.c += (this.rot(s.c) - this.c) * kc;
    this.y += (this.rot(s.y) - this.y) * k;
    this.lo += (this.rot(s.lo) - this.lo) * kc;
    this.hi += (this.rot(s.hi) - this.hi) * kc;
    this.nC.setAttribute('transform', `rotate(${this.c.toFixed(2)})`);
    this.nY.setAttribute('transform', `rotate(${this.y.toFixed(2)})`);
    this.label(this.lC, 97, this.c);
    this.label(this.lY, 72, this.y + (this.y >= this.c ? 12 : -12));   // beside its tip, away from the cloud needle
    let a1 = Math.min(this.lo, this.hi), a2 = Math.max(this.lo, this.hi);
    if (a2 - a1 < 3) { const mid = (a1 + a2) / 2; a1 = mid - 1.5; a2 = mid + 1.5; }
    this.wedge.setAttribute('d', `M ${this.pt(88, a1)} A 88 88 0 0 1 ${this.pt(88, a2)} L ${this.pt(28, a2)} A 28 28 0 0 0 ${this.pt(28, a1)} Z`);
    this.el.classList.toggle('in', !!s.inW);
    for (let i = 0; i < 3; i++) {
      this.f[i] += ((s.oks[i] ? 1 : s.fills[i]) - this.f[i]) * k;
      this.fills[i].style.width = (this.f[i] * 100).toFixed(1) + '%';
      this.bars[i].classList.toggle('ok', !!s.oks[i]);
    }
    const h = clamp(s.hold, 0, 1);
    this.holdI.style.width = (h * 100).toFixed(1) + '%';
    this.op += ((1 - (1 - G.fadeTo) * h) - this.op) * (1 - Math.exp(-dt / 0.6));   // the ruler is being put down
    this.el.style.opacity = this.op.toFixed(3);
  },
  // the ONE control to change next (i = −1: none); arrow '←' '→' (slider) or '↺' '↻' (dial)
  next(i, arrow = '') {
    if (i === this.nI && arrow === this.nA) return;
    this.nI = i; this.nA = arrow;
    UI.ctls.forEach((el, j) => {
      let nx = el.querySelector('.nx');
      if (j === i) {
        if (!nx) { nx = document.createElement('span'); nx.className = 'nx'; el.appendChild(nx); }
        nx.textContent = arrow;
        nx.classList.toggle('l', arrow === '←');
      }
      el.classList.toggle('next', j === i);
    });
  },
  band(i, r) { const el = UI.ctls[i]; if (el && el.setBand) el.setBand(r); }
};

// ==== SECTION: AUDIO ====
// M8: optional sound. 🔈 button (bottom-left, also on the start screen), default OFF. While OFF no AudioContext is
// created and nothing here runs → the game is exactly the same without sound (everything is also shown on screen).
// Turning ON creates / resumes the AudioContext INSIDE that tap (iOS); navigator.audioSession.type = "playback".
// Web Audio synthesis only (no files). Graph: voices → bus (ending fade) → muffle low-pass (squint, fur) → master.
// No game code calls in here: AudioFX.update (SECTION MAIN) READS the game state every frame and plays a cue when it
// changes – stage-1 swipe count, stage-2 size window, stage-3 wind slider / steps / gauge, stage-5 eyelids,
// stage-6 head touching the grass, every Flow success, the ending clock.
const AUD = {
  master: 0.32,                 // master volume (≤ 0.35)
  fadeS: 0.5,                   // fade when switching on / off
  wind: { base: 0.55, s3Max: 1.3, f0: 300, f1: 650 },          // soft wind always; stage 3 follows the wind slider
  whoosh: { peak: 1.1, dur: 0.7, durLast: 1.4 },               // stage 1, each swipe (last = the mountains)
  chime2: { peak: 0.12, gapS: 1.5, outS: 0.5 },                // stage 2, the ratio enters the size window
  steps: { peak: 0.5, chimeFrom: 0.35, chime: 0.08 },          // stage 3, muffled steps → soft chimes
  muffle: { open: 16000, squint: 1500, fur: 650 },             // low-pass (Hz): stage 5 squint, ending fur
  rustle: { peak: 0.35, n: 9, dur: 0.6 },                      // stage 6, the head touches the grass
  grassStep: { peak: 0.45 },                                   // v1.4: stage 2, the observer's footsteps on the grass
  success: { peak: 0.16 },                                     // every success
  ending: { inFrom: 11.5, inS: 6, breath: 0.9, heart: 0.5, bpm: 54, outS: 2 },   // breathing + heartbeat
  notes: [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5]       // pentatonic chimes
};
const AudioFX = {
  enabled: false, ctx: null, btn: null, fresh: true, tk: 0, pt: 0, ni: 0,
  last: { n: -1, state: '', idx: 0, step2: 0, landT: 99, step: 0, inWin: false, outT: 9, chimeT: 9, beat: 0 },
  init() {
    this.btn = $('sndBtn');
    if (!this.btn) return;
    this.btn.addEventListener('pointerdown', (e) => e.stopPropagation());
    this.btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); this.toggle(); });
    document.addEventListener('touchend', () => this.unlock(), { passive: true });   // iOS: resume after a screen lock
    this.paint();
  },
  paint() {
    const b = this.btn;
    if (!b) return;
    b.textContent = this.enabled ? '🔊' : '🔈';
    b.classList.toggle('on', this.enabled);
    b.setAttribute('aria-pressed', this.enabled ? 'true' : 'false');
  },
  safe(p) { if (p && p.catch) p.catch(() => {}); },
  toggle() {
    const tk = ++this.tk;
    this.enabled = !this.enabled;
    if (this.enabled && !this.ctx && !this.build()) this.enabled = false;
    this.paint();
    if (!this.ctx) return;
    if (this.enabled) { this.fresh = true; this.unlock(); this.ramp(AUD.master); }
    else {
      this.ramp(0);
      setTimeout(() => { if (tk === this.tk && !this.enabled) this.safe(this.ctx.suspend()); }, AUD.fadeS * 1000 + 300);
    }
  },
  // called inside taps (START button, any touch): resume only if the sound is ON and a context exists
  unlock() {
    if (!this.enabled || !this.ctx || this.ctx.state === 'running') return;
    this.safe(this.ctx.resume());
  },
  build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
      const c = new AC();
      this.ctx = c;
      const s = c.createBufferSource();                       // iOS: a silent sample inside the tap unlocks output
      s.buffer = c.createBuffer(1, 1, c.sampleRate); s.connect(c.destination); s.start(0);
      this.master = c.createGain(); this.master.gain.value = 0;
      this.muffle = this.filt('lowpass', AUD.muffle.open, 0.5);
      this.bus = c.createGain();
      this.bus.connect(this.muffle); this.muffle.connect(this.master); this.master.connect(c.destination);
      const N = c.sampleRate * 4;
      this.noise = c.createBuffer(1, N, c.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < N; i++) d[i] = Math.random() * 2 - 1;
      // looping voices (silent until needed): wind, breathing; heartbeat bus
      this.windF = this.filt('bandpass', AUD.wind.f0, 0.8);
      this.windG = this.loop(this.windF, this.filt('lowpass', 1200, 0.5));
      this.breathF = this.filt('bandpass', 600, 0.6);
      this.breathG = this.loop(this.breathF, this.filt('lowpass', 900, 0.5));
      this.heartG = c.createGain(); this.heartG.gain.value = 0;
      const hl = this.filt('lowpass', 240, 0.7);
      this.heartG.connect(hl); hl.connect(this.bus);
      return true;
    } catch (e) {
      console.warn('audio', e);
      this.ctx = null;
      return false;
    }
  },
  filt(type, f, q) { const b = this.ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; },
  noiseSrc() { const s = this.ctx.createBufferSource(); s.buffer = this.noise; return s; },
  loop(f1, f2) {   // endless noise → f1 → f2 → gain (returned) → bus
    const s = this.noiseSrc(), g = this.ctx.createGain();
    s.loop = true; g.gain.value = 0;
    s.connect(f1); f1.connect(f2); f2.connect(g); g.connect(this.bus);
    s.start(0, Math.random() * 3);
    return g;
  },
  ramp(v) {
    const g = this.master.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(v, t + AUD.fadeS);
  },
  set(p, v, tau) { p.setTargetAtTime(v, this.ctx.currentTime, tau); },
  // ---- one-shot voices (soft attacks, no clicks) ----
  tone(f, t, peak, att, tau, type, dest) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + att); g.gain.setTargetAtTime(0, t + att, tau);
    o.connect(g); g.connect(dest || this.bus);
    o.start(t); o.stop(t + att + tau * 8);
    return o;
  },
  chime(t, f, peak) { this.tone(f, t, peak, 0.008, 0.55); this.tone(f * 2.01, t, peak * 0.22, 0.006, 0.22); },
  note() { const N = AUD.notes; this.ni = (this.ni + 1 + Math.floor(Math.random() * 2)) % N.length; return N[this.ni]; },
  whoosh(t, last) {
    const A = AUD.whoosh, dur = last ? A.durLast : A.dur, f = last ? [160, 800, 260] : [250, 1400, 450];
    const s = this.noiseSrc(), b = this.filt('bandpass', f[0], 1.2), g = this.ctx.createGain();
    b.frequency.setValueAtTime(f[0], t);
    b.frequency.exponentialRampToValueAtTime(f[1], t + dur * 0.45);
    b.frequency.exponentialRampToValueAtTime(f[2], t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(A.peak * (last ? 0.85 : 1), t + dur * 0.4); g.gain.linearRampToValueAtTime(0, t + dur);
    s.connect(b); b.connect(g); g.connect(this.bus);
    s.start(t, Math.random() * 3); s.stop(t + dur + 0.05);
  },
  // stage 3: a = alignment 0…1 → muffled thud fades out, soft chime fades in
  step(t, a) {
    const A = AUD.steps, k = A.peak * (0.35 + 0.65 * Yak.gait) * Math.pow(1 - a, 1.5);
    if (k > 0.004) {
      const s = this.noiseSrc(), lp = this.filt('lowpass', 360, 0.7), g = this.ctx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(k, t + 0.012); g.gain.setTargetAtTime(0, t + 0.012, 0.05);
      s.connect(lp); lp.connect(g); g.connect(this.bus);
      s.start(t, Math.random() * 3); s.stop(t + 0.5);
      this.tone(120, t, k * 0.35, 0.01, 0.05, 'triangle').frequency.exponentialRampToValueAtTime(60, t + 0.1);
    }
    const ch = A.chime * smooth((a - A.chimeFrom) / (1 - A.chimeFrom));
    if (ch > 0.003) this.chime(t, this.note(), ch);
  },
  rustle(t) {
    const A = AUD.rustle, s = this.noiseSrc(), hp = this.filt('highpass', 1800, 0.7), bp = this.filt('bandpass', 4200, 0.8), g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    for (let i = 0; i < A.n; i++) {   // a few soft crackles, fading
      const ti = t + i / A.n * A.dur + Math.random() * 0.03;
      g.gain.setTargetAtTime(A.peak * (1 - 0.7 * i / A.n) * (0.5 + 0.5 * Math.random()), ti, 0.004);
      g.gain.setTargetAtTime(0, ti + 0.012, 0.02);
    }
    s.connect(hp); hp.connect(bp); bp.connect(g); g.connect(this.bus);
    s.start(t, Math.random() * 3); s.stop(t + A.dur + 0.4);
  },
// v1.4: stage 2 footstep on the grass – a few soft dry crackles + a muffled heel thud
  grassStep(t, v) {
    const k = AUD.grassStep.peak * (0.6 + 0.4 * clamp(v / CONFIG.stage2.vFwd, 0, 1)) * (0.85 + 0.3 * Math.random());
    const s = this.noiseSrc(), hp = this.filt('highpass', 1400, 0.7), bp = this.filt('bandpass', 2600 + Math.random() * 1200, 0.9), g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    for (let i = 0; i < 5; i++) {
      const ti = t + i * 0.022 + Math.random() * 0.012;
      g.gain.setTargetAtTime(k * (1 - i * 0.15), ti, 0.004); g.gain.setTargetAtTime(0, ti + 0.01, 0.018);
    }
    s.connect(hp); hp.connect(bp); bp.connect(g); g.connect(this.bus);
    s.start(t, Math.random() * 3); s.stop(t + 0.35);
    const s2 = this.noiseSrc(), lp = this.filt('lowpass', 220, 0.7), g2 = this.ctx.createGain();
    g2.gain.setValueAtTime(0, t); g2.gain.linearRampToValueAtTime(k * 0.9, t + 0.01); g2.gain.setTargetAtTime(0, t + 0.01, 0.04);
    s2.connect(lp); lp.connect(g2); g2.connect(this.bus);
    s2.start(t, Math.random() * 3); s2.stop(t + 0.3);
  },
  bell(t) {
    const p = AUD.success.peak;
    this.tone(392, t, p, 0.15, 1.0); this.tone(587.33, t + 0.05, p * 0.5, 0.2, 1.1); this.tone(783.99, t + 0.1, p * 0.25, 0.2, 0.9);
  },
  beat(t, k) { this.tone(80, t, k, 0.012, 0.07, 'triangle', this.heartG).frequency.exponentialRampToValueAtTime(48, t + 0.12); },
  // one-shot sounds by name (also usable as a one-line hook): whoosh, chime, step, rustle, success
  cue(name, arg) {
    if (!this.enabled || !this.ctx || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime + 0.01;
    if (name === 'whoosh') this.whoosh(t, !!arg);
    else if (name === 'chime') { this.chime(t, 659.25, AUD.chime2.peak); this.chime(t + 0.16, 987.77, AUD.chime2.peak * 0.6); }
    else if (name === 'step') this.step(t, arg || 0);
    else if (name === 'rustle') this.rustle(t);
    else if (name === 'grass') this.grassStep(t, arg || 0);
    else if (name === 'success') this.bell(t);
  },
  // stage 3 alignment 0…1 (from the comparison gauge fills + hold); after success its steps are chimes
  align3() {
    const S3 = STAGES[3];
    if (S3.mode === 'settle' || S3.mode === 'turn' || S3.mode === 'rest') return 1;
    if (!Gauge3.on) return 0;
    const f = Gauge3.f, m = (f[0] + f[1] + f[2]) / 3;
    return Math.max(m * m, S3.hold / CONFIG.stage3.holdS);
  },
  update(dt) {
    if (!this.enabled || !this.ctx || this.ctx.state !== 'running') return;
    try { this.tick(dt); }
    catch (e) { console.warn('audio', e); this.enabled = false; this.paint(); this.ramp(0); }   // sound never breaks the game
  },
  tick(dt) {
    const A = AUD, L = this.last, n = Flow.n, st = Flow.state, S1 = STAGES[1], S2 = STAGES[2], S6 = STAGES[6];
    const fire = !this.fresh && n === L.n, idx = S1.idx || 0, landT = typeof S6.landT === 'number' ? S6.landT : 99;
    const step = Math.floor(Yak.phase / (Math.PI / 2));   // 4 hoof falls per walk cycle
    // ---- one-shot cues: what changed since the last frame ----
    if (fire && n === 1 && idx > L.idx) this.cue('whoosh', idx >= S1.total);
    if (fire && st === 'success' && L.state !== 'success') this.cue('success');
    if (fire && n === 6 && landT < L.landT) this.cue('rustle');
    if (fire && n === 3 && step > L.step && Yak.gait > 0.05) this.cue('step', this.align3());
    if (fire && n === 2 && (S2.steps || 0) > L.step2) this.cue('grass', Math.abs(S2.v || 0));
    L.chimeT += dt;
    if (n === 2 && st === 'play' && !S2.matched) {
      const r = Measure.compute().ratio, w = CONFIG.sizeWindow, inW = r >= w[0] && r <= w[1];
      if (fire && inW && !L.inWin && L.outT > A.chime2.outS && L.chimeT > A.chime2.gapS) { this.cue('chime'); L.chimeT = 0; }
      L.outT = inW ? 0 : L.outT + dt;
      L.inWin = inW;
    }
    L.n = n; L.state = st; L.idx = idx; L.landT = landT; L.step = step; L.step2 = S2.steps || 0; this.fresh = false;
    // ---- continuous levels (20×/s) ----
    if ((this.pt += dt) < 0.05) return;
    this.pt = 0;
    const E = CONFIG.ending, end = Ending.active ? Ending.t : -1, T = this.ctx.currentTime;
    const fur = end >= 0 ? smooth(Ending.span(E.sink)) : 0;
    const out = end >= 0 ? 1 - smooth((end - E.white) / A.ending.outS) : 1;   // everything fades with the white
    // wind: soft always; stage 3 follows the wind slider (and calms with the wind after success); slow gusts
    let wk = 0;
    if (n === 3 && Cloud.windTarget > 0) { const C = CONFIG.stage3; wk = clamp((Cloud.windTarget - C.windMin) / (C.windMax - C.windMin), 0, 1); }
    const gust = 0.8 + 0.12 * Math.sin(T * 0.31) + 0.08 * Math.sin(T * 0.73 + 1.3);
    this.set(this.windG.gain, lerp(A.wind.base, A.wind.s3Max, wk) * gust * (1 - 0.85 * fur), 0.6);
    this.set(this.windF.frequency, lerp(A.wind.f0, A.wind.f1, wk) * (0.9 + 0.25 * (gust - 0.8)), 0.6);
    // muffle: squinting (stage 5 eyelids) / inside the fur (ending)
    const M = A.muffle, sq = smooth(clamp(PostFX.v.lid, 0, 1));
    this.set(this.muffle.frequency, Math.min(M.open * Math.pow(M.squint / M.open, sq), M.open * Math.pow(M.fur / M.open, fur)), 0.12);
    // ending: muffled breathing (in step with the fur breathing) + slow heartbeat
    const eIn = end >= 0 ? smooth((end - A.ending.inFrom) / A.ending.inS) * out : 0;
    const flow = Math.cos(Math.max(0, end) * 2 * Math.PI / CONFIG.gaze.period);
    this.set(this.breathG.gain, A.ending.breath * eIn * Math.pow(Math.abs(flow), 1.6) * (flow > 0 ? 1 : 0.7), 0.06);
    this.set(this.breathF.frequency, flow > 0 ? 680 : 520, 0.2);
    this.set(this.heartG.gain, A.ending.heart * eIn, 0.3);
    if (eIn > 0.001) {
      if (L.beat < T) L.beat = T + 0.05;
      while (L.beat < T + 0.25) { this.beat(L.beat, 1); this.beat(L.beat + 0.3, 0.6); L.beat += 60 / A.ending.bpm; }
    }
    this.set(this.bus.gain, out, 0.15);
  }
};

// ==== SECTION: ENDING ====
// ~25 s, no interaction (timing: CONFIG.ending). Starts from the stage-6 LYING view (eye 0.3 m, +10°);
// ?stage=end starts from the same view. Subtitles; the 斄牛 turns, WALKS close (real walk cycle) and gazes at you;
// the camera turns to its big dark eye (catch-light, sunlit side) and leans in until the head fills the frame (≥ 2 s);
// then it sinks into the fur above the eye while the 3D view crossfades into a full-screen warm FUR SHADER
// (cream-white strands very close, soft focus, warm light glowing through, whole frame rising / falling with the
// breath, faint slow warm pulse), drawn at reduced resolution. Fade to soft white (#white) and stay white.
// Fallback: if the shader does not run (checked once with one pixel), the CSS #warm gradient is shown instead.
// MAIN calls: Ending.update(dt) → Yak.update → Ending.follow() (camera) → … → Ending.render() (fur over the 3D view).
const FUR_VS = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const FUR_FS = `
  uniform float uTime;
  uniform float uBreath;
  uniform float uPulse;
  uniform float uAspect;
  varying vec2 vUv;
  float h11(float n) { return fract(sin(n * 127.1) * 43758.5453); }
  float h21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vn(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);
  }
  // one layer of hair strands: a = angle, d = strands per screen height, w = half width, s = edge softness (cell units)
  float strands(vec2 p, float a, float d, float w, float s, float seed) {
    vec2 q = vec2(cos(a) * p.x + sin(a) * p.y, -sin(a) * p.x + cos(a) * p.y);   // x across, y along the strands
    q.x += 0.05 * sin(q.y * 1.7 + seed) + 0.06 * (vn(vec2(q.y * 1.2, seed * 7.0)) - 0.5);   // combed, gently curved
    float x = q.x * d, c = floor(x), f = fract(x) - 0.5;
    float r1 = h11(c + seed * 13.0), r2 = h11(c * 1.37 + seed * 7.0), r3 = h11(c * 2.11 + seed * 3.0);
    float cx = (r1 - 0.5) * 0.36 + 0.05 * sin(q.y * (3.0 + 4.0 * r2) + r3 * 6.2832);
    float hw = w * (0.55 + 0.9 * r2);
    float k = 1.0 - smoothstep(hw - 0.5 * s, hw + s, abs(f - cx));
    float len = smoothstep(0.28, 0.5, vn(vec2(c * 0.77 + seed * 5.0, q.y * (0.8 + 0.8 * r3))));   // strands begin / end
    return k * len * (0.55 + 0.45 * r3);
  }
  void main() {
    vec2 p = (vUv - 0.5) * vec2(uAspect, 1.0);
    float b = uBreath;
    p *= 1.0 - 0.018 * b;                     // breathing: the whole frame swells and rises a little
    p.y -= 0.022 * b;
    vec2 lp = vec2(0.10 * uAspect, 0.16) - p;
    float g = exp(-dot(lp, lp) * (2.4 - 0.4 * uPulse));   // warm light glowing through the hair
    vec3 deep = vec3(0.72, 0.48, 0.31), mid = vec3(0.95, 0.81, 0.64), hot = vec3(1.0, 0.95, 0.86);
    vec3 col = mix(deep, mid, smoothstep(0.02, 0.5, g));
    col = mix(col, hot, smoothstep(0.45, 1.0, g));
    vec3 cream = vec3(0.99, 0.95, 0.88);
    float sw = 0.004 * sin(uTime * 0.37);
    float s0 = strands(p + vec2(sw, 0.004 * b), 1.15, 95.0, 0.07, 0.05, 1.0);          // deep in the fur
    col = mix(col, col * vec3(1.05, 0.98, 0.92) + 0.07, s0 * 0.5);
    float s1 = strands(p + vec2(sw * 1.5, 0.010 * b), 1.05, 42.0, 0.075, 0.05, 2.0);   // in focus
    col = mix(col, cream * (0.80 + 0.30 * g) + vec3(0.08, 0.03, -0.02) * g, s1 * 0.85);
    float s2 = strands(p + vec2(sw * 2.5, 0.020 * b), 0.95, 16.0, 0.09, 0.11, 3.0);    // near, out of focus
    col = mix(col, cream * (0.92 + 0.15 * g), s2 * 0.4);
    float s3 = strands(p + vec2(sw * 4.0, 0.034 * b), 0.88, 6.0, 0.09, 0.11, 4.0);     // nearest, very soft
    col = mix(col, vec3(1.0, 0.94, 0.84), s3 * 0.28);
    col *= 1.0 + 0.035 * uPulse;                                                      // faint slow warm pulse
    col += vec3(0.04, 0.018, 0.0) * uPulse * g;
    col = mix(col, hot, 0.12 * g);                                                    // soft glow
    float v = length((vUv - 0.5) * vec2(1.0, 1.15));
    col *= mix(1.0, 0.82, smoothstep(0.35, 0.85, v));                                 // warm vignette
    col += (h21(gl_FragCoord.xy + fract(uTime) * 61.0) - 0.5) / 255.0;                // dither (no banding)
    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
  }`;
const BLIT_FS = `
  uniform sampler2D tFur;
  uniform float uA;
  varying vec2 vUv;
  void main() { gl_FragColor = vec4(texture2D(tFur, vUv).rgb, uA); }`;

const Ending = {
  active: false, t: 0, cues: [], furTried: false, furOK: false, furA: 0, blank: false, warmOn: false,
  start() {
    const E = CONFIG.ending, fromLie = Flow.n === 6;
    const eyeNow = fromLie ? Rig.eye : CONFIG.eyeLie;                        // ?stage=end: the same lying view
    const pitchNow = fromLie ? Rig.pitchAdd : CONFIG.gyro.maxPitchUpDeg;
    Flow.token++;
    Flow.state = 'ending';
    Input.handlers = null;
    World.resetForStage(7);
    Rig.eye = eyeNow;
    Rig.pitchAdd = pitchNow;
    this.eye0 = eyeNow;
    this.pitch0 = pitchNow;
    UI.reset();
    UI.setMap(false);
    UI.setHud(false);
    document.body.classList.add('gazing');
    UI.sub.style.color = ''; UI.sub.style.textShadow = '';
    this.active = true;
    this.t = 0; this.furA = 0; this.blank = false; this.warmOn = false;
    this.base = new THREE.Vector3(); this.pos = new THREE.Vector3(); this.look = new THREE.Vector3();
    this.eyeP = new THREE.Vector3(); this.gazeP = new THREE.Vector3(); this.furP = new THREE.Vector3();
    this.q = new THREE.Quaternion(); this.v2 = new THREE.Vector2();
    this.gDir = new THREE.Vector3(...E.gazeDir).normalize();
    this.fOff = new THREE.Vector3(...E.furOff);
    this.ov = { pos: this.pos, look: this.look, w: 0 };
    this.cues = E.sub.map(([at, i]) => [at, () => this.say(i)]).concat([[E.white, () => UI.white(true)], [E.endCard, () => UI.endCard(true)]]);
    this.cues.sort((a, b) => a[0] - b[0]);
  },
  say(i) {
    if (i === null) { UI.subtitle(null); return; }
    const ink = i === TEXT.ending.length - 1 && this.furOK;   // last line over the cream fur → warm dark ink
    UI.sub.style.color = ink ? CONFIG.ending.subInk : '';
    UI.sub.style.textShadow = ink ? '0 1px 12px rgba(255,246,230,.95)' : '';
    UI.subtitle(TEXT.ending[i]);
  },
  span(a, t = this.t) { return clamp((t - a[0]) / (a[1] - a[0]), 0, 1); },
  // M9a: where the 斄牛 is at ending time t (s along the walk + heading) – shared by update() and verifyGeometry()
  walkAt(t) {
    const E = CONFIG.ending;
    return { s: lerp(CONFIG.yak.s, E.walkTo, smooth(this.span(E.walk, t))), yaw: lerp(0, -Math.PI / 2, smooth(this.span(E.turn, t))) };
  },
  // M9a: pose on the slope along the heading – pitch through both hoof spots (hooves on the ground);
  // lifted only where the skirt hem would come closer than skirtClear to the ground (sharp crest)
  slopePose(x, s, yaw, n = 64) {   // A14: same 64 hem points as verifyGeometry (16 missed the sharp crest → skirt dipped in)
    const Y = CONFIG.yak, K = Y.scale, L = Yak.legs[1].hip.position.x * K, H = Yak.hem, c = Math.cos(yaw), sn = Math.sin(yaw);
    const g = (f, l) => groundH(s + sn * f - c * l, x + c * f + sn * l);   // f = along the heading, l = local side
    let p = 0, hf = 0, hb = 0;
    for (let i = 0; i < 2; i++) {
      const f = L * Math.cos(p);
      hf = g(f, 0); hb = g(-f, 0);
      p = Math.asin(clamp((hf - hb) / (2 * L), -0.5, 0.5));
    }
    const sp = Math.sin(p), cp = Math.cos(p), avg = (hf + hb) / 2, hem = (Y.skirtHem - Y.skirtRag) * cp;
    let need = -Infinity;
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2, lx = (H.cx + (H.A + Y.skirtLen) * Math.cos(a)) * K, lz = (H.B + Y.skirtLen) * Math.sin(a) * K;
      need = Math.max(need, g(lx * cp, lz) - lx * sp - hem);
    }
    const y = Math.max(avg, need + Y.skirtClear);
    return { y, pitch: p, lift: y - avg, need, gap: y - need };
  },
  update(dt) {
    if (!this.active) return;
    this.t += dt;
    const t = this.t, E = CONFIG.ending, Y = CONFIG.yak;
    while (this.cues.length && t >= this.cues[0][0]) this.cues.shift()[1]();
    if (!this.furTried && t > 2) this.initFur();           // once, during the calm lying view
    if (t > E.total + 1.5) this.blank = true;              // soft white fully on → stop drawing
    const k0 = smooth(t / E.settleS);                       // exact lying view (eye 0.3 m, +10°)
    Rig.eye = lerp(this.eye0, CONFIG.eyeLie, k0);
    Rig.pitchAdd = lerp(this.pitch0, CONFIG.gyro.maxPitchUpDeg, k0);
    const w = this.walkAt(t), P = this.slopePose(Y.x, w.s, w.yaw);   // M9a: follows the slope, hooves on the ground
    Yak.group.position.set(Y.x, P.y, -w.s);                          // legs walk automatically
    Yak.group.rotation.set(0, w.yaw, P.pitch);                       // turn to face you, body along the slope
    this.base.set(0, groundH(0, 0) + Rig.eye, 0);
    Yak.lookTarget = (t > E.gazeFrom) ? this.base : null;                       // head turns to gaze at you
    const f = E.furFade, b = this.span(E.sink);
    this.furA = this.furOK ? smooth((b - f[0]) / (f[1] - f[0])) : 0;
    if (!this.furOK && b >= f[0] && !this.warmOn) { this.warmOn = true; UI.warm(true); }   // CSS fallback
  },
  // camera: lying view → close-up of the sunlit eye (head fills the frame) → sinks into the fur above the eye
  follow() {
    if (!this.active) return;
    const E = CONFIG.ending, kL = smooth(this.span(E.look));
    if (kL <= 0) { Rig.override = null; return; }
    Yak.eyeBalls[1].getWorldPosition(this.eyeP);           // eye on the sunlit side (sun behind you, to the right)
    Yak.head.getWorldQuaternion(this.q);
    const kG = smooth(clamp((this.t - E.look[0]) / (E.sink[0] - E.look[0]), 0, 1));
    this.gazeP.copy(this.gDir).applyQuaternion(this.q).multiplyScalar(lerp(E.gazeDist[0], E.gazeDist[1], kG)).add(this.eyeP);
    this.furP.copy(this.fOff).applyQuaternion(this.q).add(this.eyeP);
    const kS = smooth(this.span(E.sink));
    this.gazeP.lerp(this.furP, E.sinkTo * kS);
    this.pos.copy(this.base).lerp(this.gazeP, kL);
    this.look.copy(this.eyeP).lerp(this.furP, kS);
    this.ov.w = kL;
    Rig.override = this.ov;
  },
  initFur() {
    this.furTried = true;
    try {
      this.furU = { uTime: { value: 0 }, uBreath: { value: 0 }, uPulse: { value: 0 }, uAspect: { value: 1 } };
      this.furRT = new THREE.WebGLRenderTarget(2, 2, { depthBuffer: false });
      this.furQuad = new FullScreenQuad(new THREE.ShaderMaterial({ depthTest: false, depthWrite: false,
        uniforms: this.furU, vertexShader: FUR_VS, fragmentShader: FUR_FS }));
      this.blitU = { tFur: { value: this.furRT.texture }, uA: { value: 0 } };
      this.blitQuad = new FullScreenQuad(new THREE.ShaderMaterial({ transparent: true, depthTest: false, depthWrite: false,
        uniforms: this.blitU, vertexShader: FUR_VS, fragmentShader: BLIT_FS }));
      this.sizeFur();
      renderer.setRenderTarget(this.furRT);
      this.furQuad.render(renderer);
      const px = new Uint8Array(4);   // the fur is bright cream: a dark centre pixel = the shader did not run
      renderer.readRenderTargetPixels(this.furRT, this.furRT.width >> 1, this.furRT.height >> 1, 1, 1, px);
      this.furOK = px[0] > 60 && px[1] > 40;
    } catch (e) {
      this.furOK = false;
      console.warn('fur shader', e);
    }
    renderer.setRenderTarget(null);
    if (!this.furOK) console.warn('M7: fur shader unavailable → CSS #warm fallback');
  },
  sizeFur() {
    renderer.getDrawingBufferSize(this.v2);
    const k = CONFIG.ending.furScale, w = Math.max(2, Math.round(this.v2.x * k)), h = Math.max(2, Math.round(this.v2.y * k));
    if (this.furRT.width !== w || this.furRT.height !== h) this.furRT.setSize(w, h);
    this.furU.uAspect.value = w / h;
  },
  covers() { return this.active && this.furOK && this.furA >= 0.999; },   // fur fills the screen → no 3D needed
  render() {
    if (!this.active || !this.furOK || this.furA <= 0.001) return;
    try {
      this.sizeFur();
      this.furU.uTime.value = this.t;
      this.furU.uBreath.value = Math.sin(this.t * 2 * Math.PI / CONFIG.gaze.period);
      this.furU.uPulse.value = 0.5 - 0.5 * Math.cos(this.t * 2 * Math.PI / CONFIG.ending.pulseS);
      this.blitU.uA.value = this.furA;
      renderer.setRenderTarget(this.furRT);
      this.furQuad.render(renderer);
      renderer.setRenderTarget(null);
      const ac = renderer.autoClear;
      renderer.autoClear = false;                         // blend over the 3D view (crossfade, no hard cut)
      this.blitQuad.render(renderer);
      renderer.autoClear = ac;
    } catch (e) {
      this.furOK = false;
      renderer.autoClear = true;
      renderer.setRenderTarget(null);
      if (!this.warmOn) { this.warmOn = true; UI.warm(true); }
      console.warn('fur shader', e);
    }
  }
};

// ==== SECTION: MAIN ====
// M8B auto quality: average FPS < minFps over windowS s while playing → pixel ratio one step lower
// (2 → 1.5 → 1.25), renderer + PostFX resized, no reload. Pixel ratio never above 2 (SECTION RENDERER).
const Quality = {
  steps: [2, 1.5, 1.25], minFps: 28, windowS: 4, settleS: 1.5, t: 0, frames: 0, wait: 1.5,
  reset(wait) { this.t = 0; this.frames = 0; this.wait = wait; },
  update(raw) {
    if (Flow.state === 'start' || Ending.blank || document.hidden || raw > 1) { this.reset(this.settleS); return; }
    if (this.wait > 0) { this.wait -= raw; return; }
    this.t += raw; this.frames++;
    if (this.t < this.windowS) return;
    const fps = this.frames / this.t;
    this.reset(this.settleS);
    if (fps >= this.minFps) return;
    const next = this.steps.find((s) => s < renderer.getPixelRatio() - 1e-3);
    if (next === undefined) return;
    renderer.setPixelRatio(next);
    renderer.setSize(window.innerWidth, window.innerHeight);
    PostFX.setSize();
    console.log(`auto quality: ${fps.toFixed(1)} fps → pixel ratio ${next}`);
  }
};
// M8B screen wake lock: requested in the 開始 tap, requested again when the page becomes visible
const Wake = {
  lock: null, want: false, busy: false,
  request() {
    if (!('wakeLock' in navigator) || this.busy || this.lock) return;
    this.want = true; this.busy = true;
    try {
      navigator.wakeLock.request('screen').then((l) => {
        this.busy = false; this.lock = l;
        l.addEventListener('release', () => { if (this.lock === l) this.lock = null; });
      }).catch((e) => { this.busy = false; console.warn('wakeLock', e); });
    } catch (e) { this.busy = false; console.warn('wakeLock', e); }
  },
  onVisible() { if (this.want && document.visibilityState === 'visible') this.request(); }
};
const clock = new THREE.Clock();
let lastFrameErr = '';
function frame() {
  requestAnimationFrame(frame);
  try {
    const raw = clock.getDelta(), dt = Math.min(raw, 0.05);
    Grass.uniforms.uTime.value += dt;
    Tweens.update(dt);
    Flow.update(dt);
    Ending.update(dt);
    Yak.update(dt);
    Ending.follow();                           // M7: ending camera follows the 斄牛's eye (after its pose this frame)
    Cloud.update(dt);
    Grass.updateBits(dt);
    updateCamera(dt);
    World.sky.position.copy(camera.position);
    UI.updateHud(false);
    UI.drawBrackets();
    Minimap.update();
    PostFX.update(dt);
    AudioFX.update(dt);                        // M8: optional sound (does nothing while 🔈 is OFF)
    if (!Ending.blank) {                       // M7: soft white fully on → nothing more to draw
      if (!Ending.covers()) PostFX.render();   // warm fur fills the screen → skip the 3D view (iPad)
      Ending.render();                         // fur shader crossfaded over the 3D view
    }
    Minimap.render();
    Quality.update(raw);                       // M8B: auto quality (pixel ratio 2 → 1.5 → 1.25)
  } catch (e) {
    const m = String((e && e.message) || e);
    if (m !== lastFrameErr) { lastFrameErr = m; DEBUG.err('frame: ' + m); }
  }
}

function onStart() {
  const btn = $('startBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  Gyro.request();          // must be called directly inside the tap
  AudioFX.unlock();
  Wake.request();          // M8B: keep the screen on (inside the tap)
  const st = $('start');
  st.classList.add('hide');
  setTimeout(() => { st.style.display = 'none'; }, 900);
  const p = DEBUG.startStage();
  if (p === 'end') Ending.start(); else Flow.begin(p);
}

// A14: 「再來一次」 – restart INSIDE the page (no reload: works in previews / iframes / home-screen apps, no re-download)
function restart() {
  Flow.token++;                                   // cancels every pending Flow.later
  Flow.state = 'start'; Flow.n = 0; Flow.stage = null;
  Input.handlers = null;
  Ending.active = false; Ending.blank = false; Ending.furA = 0; Ending.warmOn = false; Ending.cues = [];
  Rig.override = null; Yak.lookTarget = null;
  Lighting.solved = false;
  Gauge3.show(false);
  UI.endCard(false);
  UI.subtitle(null);
  UI.sub.style.color = ''; UI.sub.style.textShadow = '';
  UI.hideRelease();
  World.resetForStage(1);                         // also hides white / warm / victory (UI.overlays)
  UI.reset(); UI.setMap(false); UI.setHud(false);
  document.body.classList.remove('gazing');
  Quality.reset(Quality.settleS);
  const st = $('start'), btn = $('startBtn');
  btn.disabled = false;
  st.style.display = 'flex';
  requestAnimationFrame(() => requestAnimationFrame(() => st.classList.remove('hide')));   // fade the start screen back in
}

function boot() {
  World.build();
  Grass.build();
  Yak.build();
  Cloud.build();
  Lighting.build();
  PostFX.init();
  UI.init();
  AudioFX.init();                    // M8: 🔈 button (default OFF, no AudioContext until it is tapped)
  Minimap.init();
  Input.init(canvas);
  World.resetForStage(1);            // background view behind the start screen
  verifyGeometry();
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 300));
  document.addEventListener('visibilitychange', () => { Wake.onVisible(); Quality.reset(Quality.settleS); });
  // iPad Safari: no pinch / double-tap zoom, no scrolling or pull-to-refresh (except inside the red error box)
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches.length > 1) { e.preventDefault(); return; }
    const err = $('err');
    if (!(err && err.contains(e.target))) e.preventDefault();
  }, { passive: false });
  $('startBtn').addEventListener('click', onStart);
  window.__booted = true;
  requestAnimationFrame(frame);
}

try {
  boot();

} catch (e) {
  DEBUG.err('boot: ' + ((e && e.message) || e));
  console.error(e);
}
</script>
</body>
</html>

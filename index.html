    }
    mk('flags', 6.6, -2.6, flags, [3.6, 0.3, -1.8]);
  },

  // Deterministic world state at the START of stage n (7 = ending)
  resetForStage(n) {
    Rig.d = (n <= 2) ? CONFIG.stage2.startD : CONFIG.yak.s;   // stage 1–2: 40 m away; stage 3+: default 10 m
    Rig.eye = CONFIG.eyeStand;
    Rig.pitchAdd = 0; Rig.yAdd = 0; Rig.pitchFx = 0; Rig.rollAdd = 0;
    Rig.override = null;
    const early = n === 1;   // reference objects exist only until they are swiped away in stage 1
    this.refs.forEach((g, i) => { g.position.copy(this.refHome[i]); g.visible = early; });
    // A9: mountains are swiped away in stage 1 and come back in stage 6 (they rise from below, see STAGES[6].enter)
    this.mtGroup.rotation.set(0, 0, 0);
    this.mtGroup.position.set(0, n === 6 ? -2500 : 0, 0);
    this.mtGroup.visible = early || n === 6;
    // A10: clouds start at home up to stage 3; after stage 3 they keep the place the wind left them (wind calm)
    if (n <= 3) Cloud.resetDrift(); else Cloud.windTarget = 0;
    Yak.home();
    Lighting.apply(n);
    PostFX.apply(n);
    Grass.setFore(n === 5);       // close tall blades only while squinting (stage 5)
    UI.overlays();
  }
};

// Instanced grass tufts with wind sway. Tip heights are capped (Grass.cap) so the crest geometry still holds.
// Stage 5 adds a few tall close blades (Grass.fore) at the bottom of the frame for the near depth-of-field blur.
const Grass = {
  mesh: null, fore: null, foreList: [], uniforms: { uTime: { value: 0 } },
  cap(s) {
    const G = CONFIG.grass, T = CONFIG.terrain;
    if (s < 0) return G.backH;
    if (s <= T.crestS) { const u = 1 - s / T.crestS; return G.crestH + G.nearExtra * u * u; }
    return G.farH;
  },
  build() {
    const G = CONFIG.grass, T = CONFIG.terrain, rnd = rng(99);
    const pos = [], col = [], nor = [], idx = [];
    for (let b = 0; b < 5; b++) {
      const a = rnd() * Math.PI * 2, lean = 0.15 + rnd() * 0.35, hb = 0.6 + rnd() * 0.4, w = 0.012 + rnd() * 0.01;
      const ox = (rnd() - 0.5) * 0.06, oz = (rnd() - 0.5) * 0.06, ca = Math.cos(a), sa = Math.sin(a);
      const base = pos.length / 3;
      [[0, 1], [0.55, 0.6], [1, 0]].forEach(([t, wf]) => {
        const y = t * hb, off = lean * t * t * hb, cx = ox + ca * off, cz = oz + sa * off, c = 0.45 + 0.55 * t;
        if (wf > 0) {
          const px = -sa * w * wf, pz = ca * w * wf;
          pos.push(cx - px, y, cz - pz, cx + px, y, cz + pz);
          col.push(c, c, c, c, c, c); nor.push(0, 1, 0, 0, 1, 0);
        } else {
          pos.push(cx, y, cz); col.push(c, c, c); nor.push(0, 1, 0);
        }
      });
      idx.push(base, base + 1, base + 2, base + 1, base + 3, base + 2, base + 2, base + 3, base + 4);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    geo.setIndex(idx);
    const mat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
    mat.onBeforeCompile = (sh) => {
      sh.uniforms.uTime = this.uniforms.uTime;
      sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
        #ifdef USE_INSTANCING
          vec2 gp = vec2(instanceMatrix[3][0], instanceMatrix[3][2]);
        #else
          vec2 gp = vec2(0.0);
        #endif
        float gw = sin(uTime * 1.6 + gp.x * 0.45 + gp.y * 0.3) * 0.6 + sin(uTime * 3.1 + gp.x * 1.7 - gp.y * 1.3) * 0.4;
        float gb = position.y * position.y;
        transformed.x += gw * 0.06 * gb;
        transformed.z += gw * 0.025 * gb;`);
    };
    const n = G.tufts, nA = Math.round(n * G.nearFrac);
    const mesh = new THREE.InstancedMesh(geo, mat, n);
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sc = new THREE.Vector3(), p = new THREE.Vector3(), c = new THREE.Color();
    const cols = [new THREE.Color(0x9da54e), new THREE.Color(0xb7a85a), new THREE.Color(0x7f9440), new THREE.Color(0xc9b56e)];
    for (let i = 0; i < n; i++) {
      let s, x;
      if (i < nA) { s = lerp(-2, T.crestS + 2.6, rnd()); x = lerp(-22, 22, rnd()); }
      else { s = lerp(-34, -2, rnd()); x = lerp(-28, 28, rnd()); }
      if (Math.abs(s) < G.clear && Math.abs(x) < G.clear) s += 0.8;   // keep blades off the camera
      const h = this.cap(s) * (0.45 + 0.55 * rnd());
      p.set(x, groundH(s, x) - 0.01, -s);
      e.set((rnd() - 0.5) * 0.2, rnd() * 6.283, (rnd() - 0.5) * 0.2);
      q.setFromEuler(e);
      const ws = 0.8 + rnd() * 0.8;
      sc.set(ws, h, ws);
      m4.compose(p, q, sc);
      mesh.setMatrixAt(i, m4);
      c.copy(cols[Math.floor(rnd() * cols.length)]).multiplyScalar(0.85 + rnd() * 0.3);
      mesh.setColorAt(i, c);
    }
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.frustumCulled = false;
    mesh.receiveShadow = true;
    this.mesh = mesh;
    scene.add(mesh);
    // stage 5: tall close blades poking into the bottom of the frame (blurred by the near depth of field)
    const F = G.fore, fr = rng(4711), fm = new THREE.InstancedMesh(geo, mat, F.n);
    for (let i = 0; i < F.n; i++) {
      const s = lerp(F.sMin, F.sMax, fr()), x = lerp(F.xMin, F.xMax, fr()), h = lerp(F.hMin, F.hMax, fr());
      const gy = groundH(s, x);
      p.set(x, gy - 0.01, -s);
      e.set((fr() - 0.5) * 0.25, fr() * 6.283, (fr() - 0.5) * 0.25);
      q.setFromEuler(e);
      const ws = 1.6 + fr() * 1.2;
      sc.set(ws, h, ws);
      m4.compose(p, q, sc);
      fm.setMatrixAt(i, m4);
      c.copy(cols[Math.floor(fr() * cols.length)]).multiplyScalar(0.8 + fr() * 0.3);
      fm.setColorAt(i, c);
      this.foreList.push({ s, x, top: gy + h });
    }
    fm.instanceMatrix.needsUpdate = true;
    if (fm.instanceColor) fm.instanceColor.needsUpdate = true;
    fm.frustumCulled = false;
    fm.receiveShadow = true;
    fm.visible = false;
    this.fore = fm;
    scene.add(fm);
  },
  setFore(on) { if (this.fore) this.fore.visible = !!on; },
  // A11 (2): grass bits kicked up when the head touches the grass (stage 6). Built on first use; ONE instanced draw call.
  // Purely visual: tiny (≤ 5.5 cm), short-lived (≤ 3.8 s).
  bits: null, bitList: [],
  buildBits() {
    const B = CONFIG.grassBits, rnd = rng(2024);
    const mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshLambertMaterial({ side: THREE.DoubleSide }), B.n);
    const cols = [0x9da54e, 0xb7a85a, 0x7f9440, 0xc9b56e, 0xe0d6a0].map((h) => new THREE.Color(h)), c = new THREE.Color();
    this._z = new THREE.Matrix4().makeScale(0, 0, 0);
    this._m = new THREE.Matrix4(); this._q = new THREE.Quaternion(); this._s = new THREE.Vector3();
    for (let i = 0; i < B.n; i++) {
      c.copy(cols[i % cols.length]).multiplyScalar(0.85 + 0.3 * rnd());
      mesh.setColorAt(i, c);
      mesh.setMatrixAt(i, this._z);
      this.bitList.push({ alive: false, p: new THREE.Vector3(), v: new THREE.Vector3(), rot: new THREE.Euler(), w: new THREE.Vector3(),
        len: 0, wid: 0, life: 0, age: 0, ph: 0 });
    }
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.frustumCulled = false;
    mesh.visible = false;
    this.bits = mesh;
    scene.add(mesh);
  },
  // ox = observer x, os = observer s (world z = −s), yawDeg = view direction (CONFIG.baseYawDeg)
  burst(ox, os, yawDeg) {
    if (!this.bits) this.buildBits();
    const B = CONFIG.grassBits, R = Math.random, yw = rad(yawDeg), m = this.bits;
    const fx = -Math.sin(yw), fz = -Math.cos(yw), rx = -fz, rz = fx;   // forward / right on the ground
    this.bitList.forEach((b, i) => {
      const f = lerp(B.fwdMin, B.fwdMax, R()), l = (R() * 2 - 1) * B.side * (0.4 + 0.6 * f / B.fwdMax);
      const dx = fx * f + rx * l, dz = fz * f + rz * l, x = ox + dx, z = -os + dz;
      b.p.set(x, groundH(-z, x) + 0.02, z);
      const dl = Math.hypot(dx, dz) || 1, out = lerp(B.outMin, B.outMax, R());
      b.v.set(dx / dl * out, lerp(B.upMin, B.upMax, R()), dz / dl * out);   // up, and away from the head
      b.rot.set(R() * 6.283, R() * 6.283, R() * 6.283);
      b.w.set((R() - 0.5) * B.spin, (R() - 0.5) * B.spin, (R() - 0.5) * B.spin);
      const seed = R() < B.seedFrac;
      b.len = seed ? lerp(0.006, 0.012, R()) : lerp(B.lenMin, B.lenMax, R());
      b.wid = seed ? b.len * 0.8 : lerp(0.004, 0.008, R());
      b.life = lerp(B.lifeMin, B.lifeMax, R());
      b.age = -R() * B.stagger;
      b.ph = R() * 6.283;
      b.alive = true;
      m.setMatrixAt(i, this._z);
    });
    m.instanceMatrix.needsUpdate = true;
    m.visible = true;
  },
  updateBits(dt) {
    if (!this.bits || !this.bits.visible || dt <= 0) return;
    const B = CONFIG.grassBits, m = this.bits;
    let any = false;
    this.bitList.forEach((b, i) => {
      if (!b.alive) return;
      any = true;
      b.age += dt;
      if (b.age < 0) return;                               // not yet kicked up (stays invisible)
      const eh = Math.exp(-B.drag * dt);
      b.v.x *= eh; b.v.z *= eh;
      b.v.y = (b.v.y - B.gravity * dt) * Math.exp(-(b.v.y < 0 ? B.dragDown : B.drag) * dt);   // light bits fall slowly
      const fl = Math.sin(b.age * B.flutterHz * 6.283 + b.ph) * B.flutter * (b.v.y < 0 ? 1 : 0.3);
      b.p.x += (b.v.x + fl - B.windX) * dt;
      b.p.y += b.v.y * dt;
      b.p.z += b.v.z * dt;
      const sl = b.v.y < 0 ? 0.5 : 1;
      b.rot.x += b.w.x * dt * sl; b.rot.y += b.w.y * dt * sl; b.rot.z += b.w.z * dt * sl;
      if ((b.v.y < 0 && b.p.y < groundH(-b.p.z, b.p.x) + 0.01) || b.age > b.life) {
        b.alive = false; m.setMatrixAt(i, this._z); return;
      }
      const fade = 1 - smooth((b.age - (b.life - 0.5)) / 0.5);
      this._q.setFromEuler(b.rot);
      this._s.set(b.wid * fade, b.len * fade, 1);
      this._m.compose(b.p, this._q, this._s);
      m.setMatrixAt(i, this._m);
    });
    m.instanceMatrix.needsUpdate = true;
    if (!any) m.visible = false;
  }
};

// ==== SECTION: YAK ====
// Procedural 斄牛 (M2): sculpted body + shoulder hump; shell-texture fur drawn as ONE instanced draw call
// per body part (cheap on iPad); long hanging skirt hair with a ragged hem that sways; head on a neck pivot
// that turns / looks at a target; big dark glossy eyes with a catch-light + blinking; horns, ears, bushy tail;
// four jointed legs whose walk cycle is driven by the REAL ground displacement (no foot sliding); breathing.
// The model is built at 2.8 m (base units) and the whole group is scaled by CONFIG.yak.scale.
// Fur colour is a cloud-like white; the deep fur layers darken toward the cloud's cool blue-grey (same 神情).
// Rim glow on fur edges (stage 4+): Yak.uni.uRim (0 = off), set by Lighting.
// API for later milestones:
//   Yak.home()                       reset pose at the default spot
//   Yak.lookTarget = Vector3 | null  head turns toward a world point (null = calm idle look-around)
//   Yak.treadmill = m/s              walk in place (debug ?walk=1); moving Yak.group also walks automatically
//   Yak.update(dt)                   called every frame (SECTION MAIN)
//   Yak.eyeWorld(out)                world position of the 斄牛's eye (ending close-up)
//   Yak.group.rotation (order 'YZX'): y = heading (0 = sideways, head right; π = head left; −π/2 = facing the observer),
//                                     z = body pitch along the slope (stage 3 walking up the crest)
const Fur = {
  tex: null,
  init() {
    // R = hair strands (streaks along v → hanging hair), G = fine random
    const N = 256, d = new Uint8Array(N * N * 4), rnd = rng(7);
    for (let i = 0; i < N; i++) {
      let j = 0;
      while (j < N) {
        const len = 4 + Math.floor(rnd() * 10), v = Math.pow(rnd(), 0.7);
        for (let k = 0; k < len && j < N; k++, j++) {
          const o = (j * N + i) * 4;
          d[o] = Math.floor(v * (1 - 0.35 * (k / len)) * 255);
          d[o + 1] = Math.floor(rnd() * 255);
          d[o + 2] = 0; d[o + 3] = 255;
        }
      }
    }
    const t = new THREE.DataTexture(d, N, N, THREE.RGBAFormat);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.magFilter = THREE.LinearFilter;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.generateMipmaps = true;
    t.needsUpdate = true;
    this.tex = t;
  }
};
// mode 0 = body fur shells (push along normal), mode 1 = hanging skirt hair (push sideways + strong droop, ragged hem, sway)
// The shell index comes from the per-instance attribute aShell (0 = skin … →1 = hair tips).

function furMaterial(color, len, rep, mode, side) {
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.95, metalness: 0 });
  if (side) m.side = side;
  const u = {
    uLen: { value: len }, uMode: { value: mode },
    uFur: { value: Fur.tex }, uRep: { value: new THREE.Vector2(rep[0], rep[1]) },
    uHemF: { value: Yak.hemF || 0 },   // M9a: ragged hem band (share of the skirt height, set in skirtGeometry)
    uTime: Yak.uni.uTime, uWalk: Yak.uni.uWalk, uGait: Yak.uni.uGait, uRim: Yak.uni.uRim
  };
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, u);
    sh.vertexShader = 'uniform float uLen;\nuniform float uMode;\nuniform float uTime;\nuniform float uWalk;\nuniform float uGait;\n' +
      'attribute float aShell;\nattribute vec2 aFurUv;\nvarying vec2 vFurUv;\nvarying float vShell;\n' +
      sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
        vFurUv = aFurUv;
        vShell = aShell;
        vec3 fdir = normalize(normal);
        if (uMode > 0.5) fdir = normalize(vec3(normal.x, 0.0, normal.z) + vec3(0.0001));
        transformed += fdir * aShell * uLen;
        transformed.y -= aShell * aShell * uLen * (uMode > 0.5 ? 1.6 * smoothstep(0.0, 0.3, aFurUv.y) : 0.5);   // M9a: no droop at the hem
        if (uMode > 0.5) {
          float hang = 1.0 - aFurUv.y;
          hang *= hang;
          float sw = sin(uTime * 1.3 + position.x * 2.1) * 0.010 + sin(uWalk * 2.0 + position.x * 1.7) * 0.045 * uGait;
          transformed.x += sw * hang;
          transformed.z += sin(uTime * 0.9 + position.x * 3.3 + position.z) * 0.008 * hang * sign(position.z);
        }`);
    sh.fragmentShader = 'uniform float uMode;\nuniform float uRim;\nuniform float uHemF;\nuniform sampler2D uFur;\nuniform vec2 uRep;\nvarying vec2 vFurUv;\nvarying float vShell;\n' +
      sh.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>
        vec4 fz = texture2D(uFur, vFurUv * uRep);
        if (vShell > 0.001 && fz.r < vShell) discard;
        if (uMode > 0.5) {
          float hem = texture2D(uFur, vec2(vFurUv.x * uRep.x * 1.7, 0.31)).g;
          if (vFurUv.y < hem * uHemF) discard;   // M9a: ragged tips only within ±skirtRag of the real hem
          if (vShell > 0.001 && fz.r < 0.35 * (1.0 - smoothstep(0.0, 0.45, vFurUv.y))) discard;   // inner layer stays dense
          diffuseColor.rgb *= mix(vec3(0.84, 0.86, 0.92), vec3(1.0), smoothstep(0.0, 0.35, vFurUv.y));
        }
        diffuseColor.rgb *= mix(vec3(0.74, 0.77, 0.84), vec3(1.05), vShell) * (0.94 + 0.10 * fz.g);`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        if (uRim > 0.001) {
          float rimV = 1.0 - clamp(abs(dot(normal, normalize(vViewPosition))), 0.0, 1.0);
          totalEmissiveRadiance += diffuseColor.rgb * uRim * pow(rimV, 2.5) * (0.35 + 0.65 * vShell);
        }`);
  };
  m.customProgramCacheKey = () => 'fur-v4';
  return m;
}

const Yak = {
  group: null, body: null, head: null, tail: null, legs: [], ears: [], eyes: [], eyeBalls: [],
  uni: { uTime: { value: 0 }, uWalk: { value: 0 }, uGait: { value: 0 }, uRim: { value: 0 } },
  NECK: new THREE.Vector3(0.80, 1.12, 0),
  t: 0, phase: 0, gait: 0, treadmill: 0, lookTarget: null,
  hy: 0, hp: -0.06, idleT: 0, idleIdx: 0, blinkT: 2.5, blinkK: 1, swT: 4, swK: 9, earT: 3, earK: 9, earSide: 0,
  _last: new THREE.Vector3(), _has: false, _v: new THREE.Vector3(), _aim: { y: 0, p: 0 },
  // calm idle look-around: [kind, yaw, pitch, seconds]   'obs' = turn toward the observer
  IDLE: [['yp', 0, -0.06, 4.5], ['obs', 0, 0, 6], ['yp', 0.25, -0.32, 4], ['yp', -0.35, 0.02, 4.5], ['obs', 0, 0.04, 5], ['yp', 0.1, -0.14, 4]],

  bodyGeometry() {
    const geo = new THREE.SphereGeometry(1, 72, 44), p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const px = x * 1.1 - 0.12, pz = z * 0.52;
      let py = y * 0.46 + 1.06;
      if (y > 0) py += 0.14 * Math.exp(-Math.pow((px - 0.42) / 0.42, 2)) * Math.pow(y, 1.5);  // shoulder hump
      if (y > 0) py -= 0.04 * Math.exp(-Math.pow((px + 0.9) / 0.4, 2)) * y;                    // lower rump
      if (y < 0) py -= 0.06 * Math.exp(-Math.pow((px - 0.55) / 0.4, 2)) * (-y);                // deep chest
      if (x > 0.5 && y > 0) { const k = (x - 0.5) / 0.5; py -= 0.12 * k * k * y; }            // neck slopes to head
      p.setXYZ(i, px, py, pz);
    }
    geo.computeVertexNormals();
    geo.setAttribute('aFurUv', geo.attributes.uv.clone());
    return geo;
  },
  ell(sx, sy, sz, x, y, z, ws = 40, hs = 28) {
    const g = new THREE.SphereGeometry(1, ws, hs);
    g.scale(sx, sy, sz); g.translate(x, y, z);
    g.setAttribute('aFurUv', g.attributes.uv.clone());
    return g;
  },
  // Elliptic curtain of long hair hanging from inside the body down to the hem (v = 0 at hem, 1 at top)
  skirtGeometry() {
    // M9a: geometry starts at the lowest ragged tips (skirtHem − skirtRag); the shader trims a 2·skirtRag band → real hem skirtHem
    const Y = CONFIG.yak, NA = 80, NV = 8, cx = -0.12, yTop = 1.0, yBot = (Y.skirtHem - Y.skirtRag) / Y.scale;   // base units
    this.hemF = 2 * Y.skirtRag / ((yTop - yBot) * Y.scale);   // ragged band as a share of the skirt height (uHemF)
    const pos = [], nor = [], uv = [], idx = [];
    for (let j = 0; j <= NV; j++) {
      const v = j / NV, y = lerp(yBot, yTop, v), bul = 0.03 * Math.sin(Math.PI * v);
      const A = lerp(1.13, 1.03, v) + bul, B = lerp(0.64, 0.47, v) + bul;
      if (j === 0) this.hem = { cx, A, B };                   // hem ellipse (base units) → Ending.slopePose
      for (let i = 0; i <= NA; i++) {
        const a = i / NA * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
        pos.push(cx + A * ca, y, B * sa);
        const nx = ca / A, nz = sa / B, l = Math.hypot(nx, nz);
        nor.push(nx / l, 0, nz / l);
        uv.push(i / NA, v);
      }
    }
    for (let j = 0; j < NV; j++) for (let i = 0; i < NA; i++) {
      const a = j * (NA + 1) + i, b = a + NA + 1;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setAttribute('aFurUv', new THREE.Float32BufferAttribute(uv.slice(), 2));
    g.setIndex(idx);
    return g;
  },
  // Tapered curved horn (relative to the neck pivot), dark base → pale tip
  hornGeometry(sd) {
    const P = [[0.12, 0.04, 0.15], [0.10, 0.10, 0.30], [0.08, 0.24, 0.42], [0.14, 0.38, 0.42], [0.23, 0.45, 0.34]]
      .map((p) => new THREE.Vector3(p[0], p[1], p[2] * sd));
    const curve = new THREE.CatmullRomCurve3(P), TS = 20, RS = 8;
    const g = new THREE.TubeGeometry(curve, TS, 0.042, RS, false);
    const pa = g.attributes.position, col = new Float32Array(pa.count * 3);
    const c = new THREE.Vector3(), v = new THREE.Vector3(), c0 = new THREE.Color(0x4a4038), c1 = new THREE.Color(0xb8ab92), cc = new THREE.Color();
    for (let k = 0; k < pa.count; k++) {
      const t = Math.floor(k / (RS + 1)) / TS;
      curve.getPointAt(t, c);
      v.fromBufferAttribute(pa, k).sub(c).multiplyScalar(1 - 0.78 * t).add(c);
      pa.setXYZ(k, v.x, v.y, v.z);
      cc.copy(c0).lerp(c1, smooth((t - 0.55) / 0.45));
      col[k * 3] = cc.r; col[k * 3 + 1] = cc.g; col[k * 3 + 2] = cc.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    return g;
  },
  addFur(parent, geo, color, shells, len, rep, mode, side) {
    const a = new Float32Array(shells);
    for (let k = 0; k < shells; k++) a[k] = k / shells;
    geo.setAttribute('aShell', new THREE.InstancedBufferAttribute(a, 1));
    const mesh = new THREE.InstancedMesh(geo, furMaterial(color, len, rep, mode, side), shells);
    const I = new THREE.Matrix4();
    for (let k = 0; k < shells; k++) mesh.setMatrixAt(k, I);
    mesh.instanceMatrix.needsUpdate = true;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.frustumCulled = false;
    parent.add(mesh);
    return mesh;
  },
  build() {
    const Y = CONFIG.yak, g = new THREE.Group();
    g.rotation.order = 'YZX';   // heading (y) first, then pitch along the body (z); x/z = 0 → identical to default
    Fur.init();
    const std = (c, r) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: 0 });
    const part = (geo, mat, parent, x = 0, y = 0, z = 0) => {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
      parent.add(m); return m;
    };
    // body (bobs / breathes while the legs stay on the ground)
    const body = new THREE.Group(); g.add(body); this.body = body;
    this.addFur(body, this.bodyGeometry(), Y.color, Y.furShells, Y.furLen, [8, 2.6], 0);
    this.addFur(body, this.ell(0.36, 0.37, 0.33, 0.64, 1.05, 0), Y.color, Math.max(4, Math.round(Y.furShells * 0.7)), 0.06, [3, 1.5], 0);  // neck ruff
    this.addFur(body, this.skirtGeometry(), Y.skirtColor, Y.skirtShells, Y.skirtLen, [10, 0.2], 1, THREE.DoubleSide);
    // tail
    const tail = new THREE.Group(); tail.position.set(-1.17, 1.24, 0); body.add(tail); this.tail = tail;
    this.addFur(tail, this.ell(0.1, 0.42, 0.11, -0.07, -0.4, 0, 20, 14), Y.color, 5, 0.06, [1.2, 2], 0);
    // head on the neck pivot (yaw = turn, pitch = nod)
    const head = new THREE.Group(); head.position.copy(this.NECK); head.rotation.order = 'YZX'; body.add(head); this.head = head;
    const hs = Math.max(4, Math.round(Y.furShells * 0.6));
    this.addFur(head, this.ell(0.36, 0.27, 0.25, 0.22, -0.16, 0), Y.color, hs, 0.035, [3, 1.4], 0);               // skull
    this.addFur(head, this.ell(0.17, 0.12, 0.21, 0.16, -0.01, 0, 24, 16), 0xfbfaf7, hs, 0.07, [2, 1], 0);      // forelock
    this.addFur(head, this.ell(0.2, 0.12, 0.13, 0.32, -0.38, 0, 24, 16), Y.skirtColor, hs, 0.07, [2, 1], 0);   // chin beard
    part(new THREE.SphereGeometry(1, 28, 18), std(0xd8d0c5, 0.8), head, 0.52, -0.30, 0).scale.set(0.17, 0.14, 0.15);   // muzzle
    part(new THREE.SphereGeometry(1, 18, 12), std(0x3b322d, 0.4), head, 0.665, -0.29, 0).scale.set(0.05, 0.075, 0.12); // nose
    const hornMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.5, metalness: 0 });
    const eyeMat = new THREE.MeshPhysicalMaterial({ color: 0x0b0806, roughness: 0.12, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05 });
    const rimMat = std(0x5b4a3c, 0.9), earMat = std(0xeeebe4, 1);
    const hlMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
    [1, -1].forEach((sd) => {
      part(this.hornGeometry(sd), hornMat, head);
      const ear = new THREE.Group(); ear.position.set(0.1, -0.03, 0.22 * sd); ear.userData.sd = sd; head.add(ear); this.ears.push(ear);
      part(new THREE.SphereGeometry(1, 14, 10), earMat, ear, 0, 0, 0.085 * sd).scale.set(0.05, 0.035, 0.1);
      // big dark eye: dark skin rim + glossy eyeball + catch-light
      const eg = new THREE.Group(); eg.position.set(0.40, -0.09, 0.212 * sd); head.add(eg); this.eyes.push(eg);
      const n = new THREE.Vector3(0.36, 0.25, 0.89 * sd).normalize();
      part(new THREE.SphereGeometry(0.06, 20, 14), rimMat, eg, -n.x * 0.016, -n.y * 0.016, -n.z * 0.016);
      this.eyeBalls.push(part(new THREE.SphereGeometry(0.05, 24, 18), eyeMat, eg));
      const hl = new THREE.Mesh(new THREE.SphereGeometry(0.011, 10, 8), hlMat);
      hl.position.copy(new THREE.Vector3(0.6, 0.55, 0.62 * sd).normalize().multiplyScalar(0.05));
      eg.add(hl);
    });
    // legs (hip → knee → hoof), mostly hidden by the skirt. Walk order: LH, LF, RH, RF
    const legMat = std(0xeeeae2, 1), lowMat = std(0xe2ddd3, 1), dark = std(0x2e2823, 0.6);
    [[-0.72, 0.22, 0], [0.72, 0.22, 0.25], [-0.72, -0.22, 0.5], [0.72, -0.22, 0.75]].forEach(([lx, lz, off]) => {
      const hip = new THREE.Group(); hip.position.set(lx, 0.8, lz); g.add(hip);
      part(new THREE.CylinderGeometry(0.1, 0.085, 0.42, 10), legMat, hip, 0, -0.21, 0);
      const knee = new THREE.Group(); knee.position.y = -0.42; hip.add(knee);
      part(new THREE.CylinderGeometry(0.075, 0.07, 0.28, 10), lowMat, knee, 0, -0.14, 0);
      part(new THREE.CylinderGeometry(0.075, 0.095, 0.1, 10), dark, knee, 0, -0.33, 0);
      this.legs.push({ hip, knee, off });
    });
    g.scale.setScalar(Y.scale);
    this.group = g;
    scene.add(g);
    this.home();
  },
  home() {
    const Y = CONFIG.yak;
    this.group.position.set(Y.x, groundH(Y.s, Y.x), -Y.s);
    this.group.rotation.set(0, 0, 0);     // sideways: length across the view, head to the right
    this.lookTarget = null;
    this._has = false;
    this.gait = 0; this.phase = 0;
    this.idleT = 0; this.idleIdx = 0;
    this.hy = 0; this.hp = -0.06;
    this.treadmill = DEBUG.walk ? 0.45 : 0;
  },
  aim(target) {
    this.group.updateMatrixWorld(true);
    const v = this.group.worldToLocal(this._v.copy(target)).sub(this.NECK);
    this._aim.y = clamp(Math.atan2(-v.z, v.x), -1.1, 1.1);
    this._aim.p = clamp(Math.atan2(v.y, Math.hypot(v.x, v.z)), -0.6, 0.35);
  },
  update(dt) {
    if (!this.group) return;
    this.t += dt;
    const t = this.t, U = this.uni, p = this.group.position, TAU = Math.PI * 2;
    U.uTime.value = t;
    // walk cycle from real displacement (+ optional treadmill)
    let dist = 0;
    if (this._has) { const d = Math.hypot(p.x - this._last.x, p.z - this._last.z); if (d < 1) dist = d; }
    this._last.copy(p); this._has = true;
    dist += this.treadmill * dt;
    const speed = dt > 1e-4 ? dist / dt : 0;
    this.gait += (clamp(speed / 0.55, 0, 1) - this.gait) * (1 - Math.exp(-dt / 0.35));
    this.phase += dist / CONFIG.yak.stride * TAU;
    const g = this.gait, ph = this.phase;
    U.uWalk.value = ph; U.uGait.value = g;
    const A = 0.3 * Math.min(1, g * 1.6);
    this.legs.forEach((L) => {
      const q = ph + L.off * TAU;
      L.hip.rotation.z = A * Math.sin(q);
      L.knee.rotation.z = -A * 1.6 * Math.max(0, Math.cos(q));
    });
    const br = Math.sin(t * TAU / 4.6);     // breathing
    this.body.position.y = g * 0.022 * (0.5 - 0.5 * Math.cos(2 * ph));
    this.body.rotation.x = g * 0.018 * Math.sin(ph);
    this.body.rotation.z = g * 0.01 * Math.sin(2 * ph + 0.7);
    this.body.scale.set(1, 1 + 0.005 * br, 1 + 0.012 * br);
    // head turn
    let ty, tp;
    if (this.lookTarget) { this.aim(this.lookTarget); ty = this._aim.y; tp = this._aim.p; }
    else {
      this.idleT += dt;
      let e = this.IDLE[this.idleIdx];
      if (this.idleT > e[3]) { this.idleT = 0; this.idleIdx = (this.idleIdx + 1) % this.IDLE.length; e = this.IDLE[this.idleIdx]; }
      if (e[0] === 'obs') { this.aim(camera.position); ty = this._aim.y; tp = this._aim.p + e[2]; }
      else { ty = e[1]; tp = e[2]; }
    }
    const kH = 1 - Math.exp(-dt / 0.9);
    this.hy += (ty - this.hy) * kH;
    this.hp += (tp - this.hp) * kH;
    this.head.rotation.set(0, this.hy, this.hp + g * 0.05 * Math.sin(2 * ph + 1.0) + 0.01 * br);
    // blink
    this.blinkT -= dt;
    if (this.blinkT <= 0) { this.blinkK = 0; this.blinkT = 2.5 + Math.random() * 4; }
    this.blinkK += dt;
    const bl = this.blinkK < 0.18 ? Math.sin(Math.PI * this.blinkK / 0.18) : 0;
    this.eyes.forEach((e) => { e.scale.y = 1 - 0.88 * bl; });
    // tail swish
    this.swT -= dt;
    if (this.swT <= 0) { this.swT = 5 + Math.random() * 6; this.swK = 0; }
    this.swK += dt;
    const sw = this.swK < 2.2 ? Math.sin(this.swK * 5.2) * Math.sin(Math.PI * this.swK / 2.2) : 0;
    this.tail.rotation.x = 0.05 * Math.sin(t * 0.8) + 0.32 * sw;
    this.tail.rotation.z = -0.06 + g * 0.08 * Math.sin(ph);
    // ear flick
    this.earT -= dt;
    if (this.earT <= 0) { this.earT = 3 + Math.random() * 5; this.earK = 0; this.earSide = Math.random() < 0.5 ? 0 : 1; }
    this.earK += dt;
    const fl = this.earK < 0.35 ? Math.sin(Math.PI * this.earK / 0.35) : 0;
    this.ears.forEach((e, i) => { e.rotation.x = e.userData.sd * (0.35 - (i === this.earSide ? 0.45 * fl : 0)); });
  },
  eyeWorld(out) {
    this.group.updateMatrixWorld(true);
    return this.eyeBalls[0].getWorldPosition(out);
  }
};

// ==== SECTION: CLOUD ====
// Volumetric-looking cumulus, cheap enough for iPad: each cloud = ONE instanced draw call of camera-facing
// "sphere puffs". Layout = big core spheres (flat-based row + rising tower + shoulders) → medium puffs on their
// surfaces → small cauliflower puffs on top. Every puff is shaded as a SPHERE (analytic normal + noise), lit by
// the sun behind the observer (front-lit), with precomputed self-shadowing (sun ray through other puffs),
// bluish sky ambient from above, and a razor-flat grey base (fragments below the base plane are cut).
// Puffs breathe/rotate extremely slowly – the cloud "never hurries".
// A10: three layers – big cloud (9.5 km), extra clouds (9–23 km), bright towering cumulonimbus (23–27 km).
// Wind (stage 3 only): every cloud rotates about the observer (distance fixed) with ω_i = ω·(9.5 km/d_i)·k(height)
// → natural parallax: near clouds sweep faster, far towers slower. Cloud.wind = big-cloud ω (°/s, leftward).
const Cloud = {
  mesh: null, list: [], tex: null, uni: null, wind: 0, windTarget: 0,
  makeTex() {
    const N = 128, data = new Uint8Array(N * N * 4), rnd = rng(4242);
    const grids = [4, 8, 16, 32].map((f) => { const a = new Float32Array(f * f); for (let i = 0; i < a.length; i++) a[i] = rnd(); return { f, a }; });
    const vn = (u, v, g) => {
      const f = g.f, x = u * f, y = v * f, xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const at = (i, j) => g.a[(((j % f) + f) % f) * f + (((i % f) + f) % f)];
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      return lerp(lerp(at(xi, yi), at(xi + 1, yi), sx), lerp(at(xi, yi + 1), at(xi + 1, yi + 1), sx), sy);
    };
    const fbm = (u, v) => 0.45 * vn(u, v, grids[0]) + 0.28 * vn(u, v, grids[1]) + 0.17 * vn(u, v, grids[2]) + 0.10 * vn(u, v, grids[3]);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const u = (i + 0.5) / N, v = (j + 0.5) / N;
      const n = fbm(u, v), n2 = fbm(u + 0.37, v + 0.61), n3 = fbm(u + 0.71, v + 0.13);
      const dx = u * 2 - 1, dy = v * 2 - 1, r = Math.sqrt(dx * dx + dy * dy);
      let a = 1 - smooth((r + (n - 0.5) * 0.24 - 0.72) / 0.16);
      a = clamp(a, 0, 1) * (1 - smooth((r - 0.9) / 0.1));
      const k = (j * N + i) * 4;
      data[k] = Math.round(n * 255); data[k + 1] = Math.round(n2 * 255); data[k + 2] = Math.round(n3 * 255); data[k + 3] = Math.round(a * 255);
    }
    const t = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    t.magFilter = THREE.LinearFilter;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.generateMipmaps = true;
    t.needsUpdate = true;
    return t;
  },
  makeMat(baseY, H, o) {
    const U = this.uni;
    return new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, fog: false,
      uniforms: {
        uTex: U.uTex, uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbHi: U.uAmbHi, uAmbLo: U.uAmbLo,
        uFog: U.uFog, uDensity: U.uDensity,
        uBaseY: { value: baseY }, uH: { value: H }, uFeather: { value: H * 0.012 },
        uFogK: { value: o.fogK }, uGain: { value: o.gain }
      },
      vertexShader: `
        attribute vec3 iOffset;
        attribute vec4 iData;   // x = half size (m), y = sun occlusion, z = rotation, w = seed
        uniform float uTime;
        uniform vec3 uSunDir;
        varying vec2 vTexUv;
        varying vec2 vQ;
        varying float vLY;
        varying float vOcc;
        varying float vDepth;
        varying vec3 vSun;
        varying vec3 vUp;
        void main() {
          float sz = iData.x * (1.0 + 0.03 * sin(uTime * 0.06 + iData.w * 6.2831));
          vec4 mv = modelViewMatrix * vec4(iOffset, 1.0);
          vec2 off = position.xy * 2.0 * sz;
          mv.xy += off;
          vUp = normalize(viewMatrix[1].xyz);              // world up, in view space
          vLY = iOffset.y + dot(vUp, vec3(off, 0.0));      // cloud-local height of this fragment
          vSun = normalize(mat3(viewMatrix) * uSunDir);
          float rot = iData.z + uTime * 0.003 * (iData.w - 0.5);
          float c = cos(rot), s = sin(rot);
          vec2 q = uv - 0.5;
          vTexUv = vec2(c * q.x - s * q.y, s * q.x + c * q.y) + 0.5;
          vQ = position.xy * 2.4;                          // |vQ| = 1 at the sphere silhouette
          vOcc = iData.y;
          vDepth = -mv.z;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform sampler2D uTex;
        uniform vec3 uSunCol;
        uniform vec3 uAmbHi;
        uniform vec3 uAmbLo;
        uniform vec3 uFog;
        uniform float uDensity;
        uniform float uBaseY;
        uniform float uH;
        uniform float uFeather;
        uniform float uFogK;
        uniform float uGain;
        varying vec2 vTexUv;
        varying vec2 vQ;
        varying float vLY;
        varying float vOcc;
        varying float vDepth;
        varying vec3 vSun;
        varying vec3 vUp;
        void main() {
          vec4 t = texture2D(uTex, vTexUv);
          float a = t.a * smoothstep(uBaseY - uFeather, uBaseY + uFeather, vLY);
          if (a < 0.01) discard;
          vec2 q = vQ + (t.gb - 0.5) * 0.5;
          float r2 = min(dot(q, q), 1.0);
          vec3 n = normalize(vec3(q, sqrt(1.0 - r2) + 0.2));
          float sunL = clamp(dot(n, vSun) * 0.6 + 0.4, 0.0, 1.0);
          float upK = dot(n, vUp) * 0.5 + 0.5;
          float hgt = clamp((vLY - uBaseY) / uH, 0.0, 1.0);
          vec3 amb = mix(uAmbLo, uAmbHi, upK) * (1.0 - 0.3 * vOcc);
          vec3 col = amb + uSunCol * sunL * (1.0 - 0.8 * vOcc) * mix(0.75, 1.0, smoothstep(0.0, 0.3, hgt));
          col *= mix(0.78, 1.0, smoothstep(0.0, 0.06, hgt));
          col *= (0.9 + 0.2 * t.r) * uGain;
          float f = 1.0 - exp(-pow(uDensity * uFogK * vDepth, 2.0));
          col = mix(col, uFog, f);
          gl_FragColor = vec4(col, a);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`
    });
  },
  // Sphere layout in cloud-local metres (x across the view, y up, z toward the observer); flat base at −H/2
  puffs(W, H, D, n, rnd) {
    const base = -H / 2, top = H / 2, P = [], cores = [];
    const add = (x, y, z, R) => {
      R = Math.min(R, W * 0.45);
      x = clamp(x, -W / 2 + R, W / 2 - R);
      y = Math.max(Math.min(y, top - R), base - R * 0.45);
      const p = { x, y, z, R }; P.push(p); return p;
    };
    const nb = 4 + Math.floor(rnd() * 3);                       // 1) flat-based row
    for (let i = 0; i < nb; i++) {
      const t = (i + 0.5) / nb, R = W * (0.12 + 0.05 * rnd()) * (1 - 0.35 * Math.abs(t - 0.5) * 2);
      cores.push(add(lerp(-W / 2, W / 2, t) + (rnd() - 0.5) * W * 0.05, base + R * 0.5, (rnd() - 0.5) * D * 0.3, R));
    }
    let cx = (rnd() - 0.5) * W * 0.12, Rt = W * 0.2, y = base + Rt * 0.9;   // 2) main tower
    while (y < top - Rt * 0.5 && cores.length < 16) {
      cores.push(add(cx, y, (rnd() - 0.5) * D * 0.15, Rt));
      y += Rt * 0.8; Rt *= 0.86; cx += (rnd() - 0.5) * Rt * 0.5;
    }
    [-1, 1].forEach((sd) => {                                   // 3) lower shoulders
      const hh = H * (0.35 + 0.2 * rnd()), x2 = sd * W * (0.22 + 0.06 * rnd());
      let yy = base + W * 0.12, R2 = W * 0.13, guard = 0;
      while (yy < base + hh && guard++ < 6) { cores.push(add(x2 + (rnd() - 0.5) * R2 * 0.4, yy, (rnd() - 0.5) * D * 0.2, R2)); yy += R2 * 0.8; R2 *= 0.85; }
    });
    const dirUp = (minY, minZ) => {
      for (let k = 0; k < 14; k++) {
        const u = rnd() * 2 - 1, a = rnd() * 6.2832, s = Math.sqrt(1 - u * u);
        const d = { x: s * Math.cos(a), y: u, z: s * Math.sin(a) };
        if (d.y >= minY && d.z >= minZ) return d;
      }
      return { x: 0, y: 1, z: 0 };
    };
    const pick = (arr) => {
      let sum = 0; arr.forEach((p) => { sum += p.R * p.R; });
      let r = rnd() * sum;
      for (const p of arr) { r -= p.R * p.R; if (r <= 0) return p; }
      return arr[arr.length - 1];
    };
    const nMed = Math.max(0, Math.round((n - P.length) * 0.42)), med = [];
    for (let i = 0; i < nMed; i++) {                            // 4) medium puffs on the cores
      const pa = pick(cores), d = dirUp(-0.25, -0.35), k = pa.R * (0.72 + 0.18 * rnd());
      med.push(add(pa.x + d.x * k, pa.y + d.y * k, pa.z + d.z * k, pa.R * (0.36 + 0.2 * rnd())));
    }
    const parents = med.length ? med : cores;
    while (P.length < n) {                                      // 5) small cauliflower puffs on top
      const pa = pick(parents), d = dirUp(0.05, -0.2), k = pa.R * (0.75 + 0.15 * rnd());
      add(pa.x + d.x * k, pa.y + d.y * k, pa.z + d.z * k, pa.R * (0.38 + 0.2 * rnd()));
    }
    // keep the visible width exactly W (θ雲 in the HUD is computed from CONFIG width)
    let mn = Infinity, mx = -Infinity;
    P.forEach((p) => { mn = Math.min(mn, p.x - p.R); mx = Math.max(mx, p.x + p.R); });
    const sc = clamp(W / (mx - mn), 0.9, 1.15), mid = (mn + mx) / 2;
    P.forEach((p) => { p.x = (p.x - mid) * sc; });
    return P;
  },
  // Self-shadowing: how much puff material lies between each puff and the sun
  shade(P, L, W) {
    const k = 1 / (W * 0.16);
    P.forEach((p) => {
      const ox = p.x + L.x * p.R * 0.5, oy = p.y + L.y * p.R * 0.5, oz = p.z + L.z * p.R * 0.5;
      let sum = 0;
      for (const q of P) {
        if (q === p) continue;
        const dx = q.x - ox, dy = q.y - oy, dz = q.z - oz, t = dx * L.x + dy * L.y + dz * L.z;
        if (t <= 0) continue;
        const d2 = dx * dx + dy * dy + dz * dz - t * t, r2 = q.R * q.R;
        if (d2 >= r2) continue;
        sum += 2 * Math.sqrt(r2 - d2) * k;
      }
      p.occ = 1 - Math.exp(-0.55 * sum);
    });
  },
  // dist = horizontal distance from the observer, y = centre height, bearing in radians (0 = straight ahead, + = right)
  makeCloud(W, H, D, n, seed, dist, y, bearing, opt = {}) {
    const o = { fogK: opt.fogK || 1, gain: opt.gain || 1 };
    const rnd = rng(seed), P = this.puffs(W, H, D, n, rnd);
    const L = new THREE.Vector3(...CONFIG.sun.dir).normalize().applyAxisAngle(_up, bearing);   // sun dir in cloud space
    this.shade(P, L, W);
    const plane = new THREE.PlaneGeometry(1, 1), geo = new THREE.InstancedBufferGeometry();
    geo.setIndex(plane.index);
    geo.setAttribute('position', plane.attributes.position);
    geo.setAttribute('uv', plane.attributes.uv);
    const mesh = new THREE.Mesh(geo, this.makeMat(-H / 2, H, o));
    mesh.frustumCulled = false;
    const c = { mesh, W, D, H, P, dist, b0: bearing, y, phi: 0, bg: !!opt.bg,
      k: clamp(1 + 0.2 * (y - CONFIG.cloud.centerY) / 5000, 0.8, 1.4) };   // upper winds slightly stronger
    this.place(c);   // local x ⟂ line of sight → width is measured across the view
    mesh.updateMatrixWorld(true);
    const eye = new THREE.Vector3(0, groundH(0, 0) + CONFIG.eyeStand, 0), v = new THREE.Vector3();
    P.forEach((p) => { v.set(p.x, p.y, p.z); mesh.localToWorld(v); p.d = v.distanceTo(eye); });
    P.sort((a, b) => b.d - a.d);           // far → near (static, the clouds are kilometres away)
    const N = P.length, off = new Float32Array(N * 3), dat = new Float32Array(N * 4);
    P.forEach((p, i) => {
      off[i * 3] = p.x; off[i * 3 + 1] = p.y; off[i * 3 + 2] = p.z;
      dat[i * 4] = p.R * 1.2; dat[i * 4 + 1] = p.occ; dat[i * 4 + 2] = rnd() * 6.283; dat[i * 4 + 3] = rnd();
    });
    geo.setAttribute('iOffset', new THREE.InstancedBufferAttribute(off, 3));
    geo.setAttribute('iData', new THREE.InstancedBufferAttribute(dat, 4));
    geo.instanceCount = N;
    scene.add(mesh);
    this.list.push(c);
    return mesh;
  },
  place(c) {
    const b = c.b0 + rad(c.phi);
    c.mesh.position.set(c.dist * Math.sin(b), c.y, -c.dist * Math.cos(b));
    c.mesh.rotation.y = -b;
  },
  resetDrift() {
    this.list.forEach((c) => { c.phi = 0; this.place(c); });
    this.wind = 0; this.windTarget = 0;
  },
  build() {
    this.tex = this.makeTex();
    this.uni = {
      uTex: { value: this.tex }, uTime: { value: 0 },
      uSunDir: { value: new THREE.Vector3(...CONFIG.sun.dir).normalize() },
      uSunCol: { value: new THREE.Color(1.25, 1.2, 1.1) },
      uAmbHi: { value: new THREE.Color(0.62, 0.72, 0.92) },
      uAmbLo: { value: new THREE.Color(0.36, 0.42, 0.55) },
      uFog: { value: new THREE.Color(CONFIG.sky.horizon) },
      uDensity: { value: CONFIG.fogDensity }
    };
    const C = CONFIG.cloud, b = rad(C.bearingDeg), q = DEBUG.lowQ ? 0.6 : 1;
    this.mesh = this.makeCloud(C.width, C.height, C.depth, C.puffs, 31, C.dist, C.centerY, b);   // list[0] = big cloud
    CONFIG.extraClouds.forEach((e, i) => {
      const [bd, dist, el, W, H, n] = e;
      this.makeCloud(W, H, W * 0.6, Math.max(30, Math.round(n * q)), 100 + i * 17, dist, dist * Math.tan(rad(el)), rad(bd));
    });
    const BL = CONFIG.bgCloudLook;
    CONFIG.bgClouds.forEach((e, i) => {
      const [bd, dist, baseY, W, H, n] = e;
      this.makeCloud(W, H, W * 0.55, Math.max(60, Math.round(n * q)), 300 + i * 29, dist, baseY + H / 2, rad(bd),
        { bg: true, fogK: BL.fogK, gain: BL.gain });
    });
  },
  update(dt) {
    if (!this.uni) return;
    this.uni.uTime.value += dt;
    const S = CONFIG.stage3;
    this.wind += (this.windTarget - this.wind) * (1 - Math.exp(-dt / S.windTau));
    if (Math.abs(this.wind) < 1e-5) return;
    const m = this.list[0], over = -m.phi;   // how far (°) the big cloud has drifted left
    const lim = over > S.driftSoftDeg ? Math.max(0.3, smooth((S.driftMaxDeg - over) / (S.driftMaxDeg - S.driftSoftDeg))) : 1;
    const w0 = this.wind * lim, R0 = CONFIG.cloud.dist;
    this.list.forEach((c) => { c.phi -= w0 * (R0 / c.dist) * c.k * dt; this.place(c); });   // leftward
  }
};

// ==== SECTION: LIGHTING ====
// Sun behind the observer (front-lit) + hemisphere sky light + ground bounce light.
// Stage 4: the "sky light" slider raises the hemisphere light and gently lowers the sun (never off → the shadow
// stays, only lighter), widens the PCF shadow blur, adds a subtle rim glow on the fur edges and more bloom.
// The "ground bounce" slider lights the belly / skirt from below. ACES tone mapping throughout.
const Lighting = {
  state: { sky: 0.35, bounce: 0.2 }, solved: false,
  build() {
    this.hemi = new THREE.HemisphereLight(CONFIG.hemi.sky, CONFIG.hemi.ground, CONFIG.hemi.intensity);
    scene.add(this.hemi);
    const d = new THREE.Vector3(...CONFIG.sun.dir).normalize();
    const tgt = new THREE.Vector3(CONFIG.yak.x, groundH(CONFIG.yak.s), -CONFIG.yak.s);
    this.sun = new THREE.DirectionalLight(CONFIG.sun.color, CONFIG.sun.intensity);
    this.sun.position.copy(tgt).addScaledVector(d, 80);   // behind the observer → front-lit
    this.sun.target.position.copy(tgt);
    this.sun.castShadow = true;
    const sc = this.sun.shadow.camera;

// ==== SECTION: POSTFX ====
// Stages 1–3 (and the start screen): direct rendering, exactly as before (MSAA).
// Stage 4+ : scene → HDR render target (+ depth texture) → UnrealBloom → final pass:
//   near depth of field (only things closer than ~4–7 m blur, i.e. the close grass), distance haze,
//   glare, "flat painting" contrast, eyelid mask (top/bottom), then ACES tone mapping + sRGB.
// PostFX.squint(lid) is driven by stage 5; all values glide smoothly (PostFX.update).
// M9b: half-closed eyes + natural blinks from the stage-6 success to the ending's fur sink (CONFIG.blink).
// Same eyelid mask, but added AFTER the lidTau smoothing (a 0.1 s blink reaches full depth) and kept out of
// PostFX.v.lid (SECTION AUDIO muffles with v.lid → half-closed eyes and blinks never muffle the sound).
const Eyes = {
  k: 0, lid: 0, flat: 0, wait: 3, seq: [], segT: 0,
  on() {
    if (Ending.active) return Ending.t < CONFIG.ending.sink[1];
    return Flow.n === 6 && Flow.state !== 'play' && Flow.state !== 'start';
  },
  gap() { const B = CONFIG.blink; return Math.max(B.minGap, lerp(B.every[0], B.every[1], Math.random())); },
  // one closure = [pause, close, hold, open] s; ~20 % double blink, ~1 in 6 slow drowsy blink
  plan() {
    const B = CONFIG.blink, R = Math.random;
    const quick = (pre) => [pre, lerp(B.close[0], B.close[1], R()), 0, lerp(B.open[0], B.open[1], R())];
    this.segT = 0;
    if (R() < B.drowsyP) { this.seq.push([0, ...B.drowsy]); return; }
    this.seq.push(quick(0));
    if (R() < B.doubleP) this.seq.push(quick(lerp(B.doubleGap[0], B.doubleGap[1], R())));
  },
  update(dt) {
    const B = CONFIG.blink, E = CONFIG.ending;
    if (!this.on()) { this.k = 0; this.lid = 0; this.flat = 0; this.seq.length = 0; this.wait = this.gap(); return; }
    const w = Ending.active ? 1 - smooth(Ending.span([E.sink[0], lerp(E.sink[0], E.sink[1], B.openBy)])) : 1;   // open in the sink
    this.k = Math.min(1, this.k + dt / B.settleS);

    if (this.seq.length) {

      b = t <= 0 ? 0 : t < c ? smooth(t / c) : t < c + h ? 1 : 1 - smooth((t - c - h) / o);

    this.flat = w * ks * B.flat;
  },
  // fully open band of the eyelid mask at screen x (−1…1), same numbers as the PostFX shader → { bot, top } in uv.y
  edges(lid, xx, c = 0.55) {
    const gap = lerp(0.62, 0.13, lid), cv = (0.05 + 0.06 * lid) * xx * xx, f = 0.015 + 0.035 * lid;

};

  init() {
    try {

      const w = Math.max(1, this._sz.x), h = Math.max(1, this._sz.y);
      this.rt = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, depthBuffer: true });

      this.mat = new THREE.ShaderMaterial({
        depthTest: false, depthWrite: false,
        uniforms: {
          tColor: { value: this.rt.texture }, tDepth: { value: this.rt.depthTexture },
          uRes: { value: new THREE.Vector2(w, h) }, cNear: { value: camera.near }, cFar: { value: camera.far },
          uMaxR: { value: P.maxBlurPx * renderer.getPixelRatio() }, uF0: { value: P.focusNear }, uF1: { value: P.focusFar },
          uBlur: { value: 0 }, uHaze: { value: 0 }, uLid: { value: 0 }, uGlare: { value: 0 }, uFlat: { value: 0 }, uLidY: { value: 0.55 },
          uHazeMax: { value: P.hazeMax }, uHazeDist: { value: P.hazeDist },
          uHazeCol: { value: new THREE.Color(CONFIG.sky.horizon).multiplyScalar(1.1) },
          uLidCol: { value: new THREE.Vector3(0.07, 0.05, 0.045) }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
        fragmentShader: `
          #include <packing>
          uniform sampler2D tColor;
          uniform sampler2D tDepth;
          uniform vec2 uRes;
          uniform float cNear;
          uniform float cFar;
          uniform float uMaxR;
          uniform float uF0;
          uniform float uF1;
          uniform float uBlur;
          uniform float uHaze;
          uniform float uLid;
          uniform float uGlare;
          uniform float uFlat;
          uniform float uLidY;
          uniform float uHazeMax;
          uniform float uHazeDist;
          uniform vec3 uHazeCol;
          uniform vec3 uLidCol;
          varying vec2 vUv;
          float linZ(vec2 uv) { return -perspectiveDepthToViewZ(texture2D(tDepth, uv).x, cNear, cFar); }
          float cocPx(float z) { return uMaxR * uBlur * (1.0 - smoothstep(uF0, uF1, z)); }
          void main() {
            vec3 col = texture2D(tColor, vUv).rgb;

              vec3 acc = col;

              float rot = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) * 6.2832;

  setSize() {

const Tweens = {
  list: [],
  add(dur, fn, done) { this.list.push({ t: 0, dur, fn, done }); },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const tw = this.list[i];
      tw.t += dt;
      const k = Math.min(1, tw.t / tw.dur);
      tw.fn(k);
      if (k >= 1) { this.list.splice(i, 1); if (tw.done) tw.done(); }
    }
  }
};

const Measure = {
  v: new THREE.Vector3(),
  compute() {
    const p = Yak.group.position;
    this.v.set(p.x, p.y + CONFIG.yak.mid, p.z);
    const dy = camera.position.distanceTo(this.v);
    const dc = camera.position.distanceTo(Cloud.mesh.position);
    const ty = thetaDeg(CONFIG.yak.length, dy), tc = thetaDeg(CONFIG.cloud.width, dc);
    return { dy, dc, ty, tc, ratio: ty / tc };
  }
};

const STAGES = [null,
  // 1 比例尺 – swipe away tree, fence, barn, tent, prayer flags, then the distant mountains (A1, A2)
  {
    enter() { this.idx = 0; this.busy = false; this.total = World.refs.length + 1; UI.guideText(TEXT.ui.g1(this.total)); },
    onSwipe(dir) {
      if (this.busy || this.idx >= this.total) return;
      const sign = dir === 'left' ? -1 : dir === 'right' ? 1 : (Math.random() < 0.5 ? -1 : 1);
      const i = this.idx++;
      this.busy = true;
      const done = () => {
        this.busy = false;
        UI.toast(TEXT.refNotes[i]);
        const left = this.total - this.idx;
        if (left > 0) UI.guideText(TEXT.ui.g1(left));
        else { UI.guideText(null); Flow.later(1.0, () => Flow.success()); }
      };
      if (i < World.refs.length) {
        const obj = World.refs[i], x0 = obj.position.x, y0 = obj.position.y;
        Tweens.add(0.7, (k) => { const e = k * k; obj.position.x = x0 + sign * 70 * e; obj.position.y = y0 + 6 * e; },
          () => { obj.visible = false; done(); });
      } else {
        const g = World.mtGroup;
        Tweens.add(1.3, (k) => { const e = k * k; g.rotation.y = -sign * 1.3 * e; g.position.y = -2500 * e; },
          () => { g.visible = false; done(); });
      }
    }
  },
  // 2 大小 – v1.4: drag = walk toward / away from the 斄牛 at a human pace (head bob, forward faster than backward,
  // footsteps on the grass); HUD + brackets show θ; finally swipe away HUD + mini-map together ("最後一把尺")
  {
    enter() {
      this.hold = 0; this.matched = false; this.gone = false; this.touched = false; UI.holdK = 0;
      this.tD = Rig.d; this.v = 0; this.ph = 0; this.bobK = 0; this.steps = 0;
      UI.guideText(TEXT.ui.g2start);
    },
    onDrag(dx, dy) {
      if (this.matched) return;
      const S = CONFIG.stage2;
      this.tD = clamp(this.tD * Math.exp(dy * (dy < 0 ? S.dragK : S.dragKBack)), S.minD, S.maxD);   // up = forward
      if (Math.abs(dy) > 0.5) this.touched = true;
    },
    onSwipe(dir) {
      if (!this.matched || this.gone || (dir !== 'left' && dir !== 'right')) return;
      this.gone = true;
      UI.swipeAwayMapHud(dir === 'left' ? -1 : 1);
      UI.guideText(null);
      Flow.later(1.2, () => Flow.success());
    },
    // the observer walks to the drag target (v < 0 = forward); every step bobs the head
    walk(dt) {
      if (dt <= 0) return;
      const S = CONFIG.stage2, W = S.walk, gap = this.tD - Rig.d;
      const want = clamp(gap * S.follow, -S.vFwd, S.vBack);
      this.v += clamp(want - this.v, -S.acc * dt, S.acc * dt);
      const nd = Rig.d + this.v * dt;
      if ((this.tD - nd) * gap <= 0) { Rig.d = this.tD; this.v = 0; } else Rig.d = clamp(nd, S.minD, S.maxD);
      const sp = Math.abs(this.v), p0 = this.ph;
      this.ph += sp * dt / lerp(W.stepMin, W.stepMax, clamp(sp / S.vFwd, 0, 1)) * Math.PI;   // π per step
      if (Math.floor(this.ph / Math.PI) > Math.floor(p0 / Math.PI)) this.steps++;          // a foot lands (AUDIO)
      this.bobK += (clamp(sp / W.fullV, 0, 1) - this.bobK) * (1 - Math.exp(-dt / 0.2));
      const k = this.bobK * (this.v > 0 ? W.backAmp : 1), s = Math.sin(this.ph), a = Math.abs(s) - 0.64;
      Rig.yAdd = W.bobY * k * a;            // lowest when the foot lands
      Rig.pitchFx = W.nodDeg * k * a;       // small nod down on each landing
      Rig.rollAdd = W.rollDeg * k * s;      // sway left / right once per two steps
    },
    update(dt) {
      this.walk(dt);
      if (this.matched) return;
      const m = Measure.compute(), w = CONFIG.sizeWindow, S = CONFIG.stage2;
      const inWin = m.ratio >= w[0] && m.ratio <= w[1];
      this.hold = inWin ? this.hold + dt : Math.max(0, this.hold - dt * 2);
      UI.holdK = clamp(this.hold / S.holdS, 0, 1);
      if (!this.touched) UI.guideText(TEXT.ui.g2start);
      else UI.guideText(inWin ? TEXT.ui.g2in : (m.ratio < w[0] ? TEXT.ui.g2small : TEXT.ui.g2big));
      if (this.hold >= S.holdS) {
        this.matched = true;
        this.tD = Rig.d;                  // stop walking here
        UI.holdK = 1;
        UI.updateHud(true);
        UI.showLastRuler(true);
        UI.guideText(TEXT.ui.g2ruler);
        UI.showHint(TEXT.ui.hint2b);
      }
    }
  },

// 3 速度 (standing) – direction dial (sideways ← → toward observer ↓) + gait slider + wind slider (A10).
  // A12: the dial is RELATIVE TO THE OBSERVER: 0 = around you (leftward, with the wind), 1 = straight toward your eye.
  // The retina only gets angles: the wind carries every cloud slowly to the LEFT; the student makes the 斄牛 move
  // in the eye the way the big cloud moves.
  // Flow: intro – it steps back behind the crest (only hump/head/horns visible) → play – the student steers it
  //       → success when, held holdS s: lateral ω close to the cloud's AND the same direction, looming
  //         loomMin–loomMax %/s, slow gait, and it has risen (s ≤ riseS). A miss < missGraceS s only pauses the timer.
  //       → settle – the wind calms; during 凝視/reflection it walks slowly to the default spot (10 m), turns sideways.
  //       At the crest (s ≤ minS) without success → it stops (stopS s, a gentle line says what was missing), walks
  //       back; after bandAfter failures faint target bands show the OK zone (they follow the wind slider).
  // No numbers on screen (A8): Gauge3 (SECTION UI) + ONE amber "next" control with an arrow + soft green frames (A10).
  // judge() = the OK rule, shared by the live check and zone() (boot check in verifyGeometry, target bands).
  {
    enter() {
      const C = CONFIG.stage3, Y = CONFIG.yak;
      this.dir = C.defaultDir; this.gaitU = C.defaultGait; this.windU = C.defaultWind;
      this.x = Y.x; this.s = Y.s; this.yaw = 0; this.pitch = 0; this.spd = 0; this.side = -1; this.turning = 0;
      this.hold = 0; this.miss = 0; this.loom = 0; this.latY = 0; this.wRef = -this.windDeg(); this.J = null;
      this.prevTy = null; this.prevB = 0; this.prevCB = 0; this.pdt = 1 / 60;
      this.warm = 0; this.rx = 0; this.okD = 0; this.okS = 0; this.playT = 0; this.tipShown = false;
      this.fails = 0; this.stopT = 0; this.last = 'short'; this.dbgT = 0; this.zU = null; this.z = null;
      this.mode = 'intro';
      Yak.treadmill = 0;
      UI.showSliders([
        { type: 'dial', frame: true, label: TEXT.ui.dirLabel, ends: [TEXT.ui.dirSide, TEXT.ui.dirToward], v: this.dir, on: (v) => { this.dir = v; } },
        { frame: true, label: TEXT.ui.gait, v: this.gaitU, on: (v) => { this.gaitU = v; } },
        { frame: true, label: TEXT.ui.wind, v: this.windU, on: (v) => { this.windU = v; this.bands(); } }
      ]);
      Gauge3.show(true);
      UI.guideText(TEXT.ui.g3start);
    },
    vOf(u) { const C = CONFIG.stage3; return C.vMin + (C.vMax - C.vMin) * Math.pow(u, C.gaitPow); },
    uOf(v) { const C = CONFIG.stage3; return Math.pow(clamp((v - C.vMin) / (C.vMax - C.vMin), 0, 1), 1 / C.gaitPow); },
    vNow() { return this.vOf(this.gaitU); },
    windDeg(u = this.windU) { const C = CONFIG.stage3; return lerp(C.windMin, C.windMax, u); },   // never zero
    // OK rule. latY / latC signed °/s (+ = right), loom %/s, v = gait speed, spd = actual speed (m/s)
    judge(latY, latC, loom, v, spd) {
      const C = CONFIG.stage3, c = -latC, m = -latY;            // leftward = positive
      const tol = Math.max(C.latTolAbs, C.latTolRel * Math.abs(c));
      const lo = Math.max(0, c - tol), hi = c + tol;            // same direction: never against the cloud
      const lat = m >= lo - C.againstTol && m <= hi;
      const slow = v <= C.slowV && spd <= C.slowV + 0.05 && loom <= C.loomMax;
      return { lo, hi, lat, slow, loom: loom >= C.loomMin && loom <= C.loomMax, wrong: m < -C.againstTol, over: m > hi,
        all: lat && slow && loom >= C.loomMin };
    },
    // A12: OK zone for a wind setting (model at refD: lateral ω = v·cos a/d, looming = v·sin a/d), in dial / gait units
    zone(windU) {
      const C = CONFIG.stage3, w = this.windDeg(windU), wr = rad(w), L = C.loomIdeal / 100, R = C.refD;
      const uI = Math.atan2(L, wr) / (Math.PI / 2), gI = this.uOf(R * Math.hypot(L, wr));
      const ok = (u, g) => {
        const v = this.vOf(g), a = u * Math.PI / 2;
        return this.judge(-deg(v * Math.cos(a) / R), -w, v * Math.sin(a) / R * 100, v, v).all;
      };
      const span = (f, c0) => {   // contiguous OK run around c0 on 0…1
        const st = 0.0025;
        if (!f(c0)) return [c0, c0];
        let lo = c0, hi = c0;
        while (lo - st >= 0 && f(lo - st)) lo -= st;
        while (hi + st <= 1 && f(hi + st)) hi += st;
        return [lo, hi];
      };
      const d = span((u) => ok(u, gI), uI), g = span((x) => ok(uI, x), gI);
      return { uI, gI, dLo: d[0], dHi: d[1], gLo: g[0], gHi: g[1], dW: (d[1] - d[0]) * 90, gW: g[1] - g[0] };
    },
    zoneNow() { if (this.zU !== this.windU) { this.zU = this.windU; this.z = this.zone(this.windU); } return this.z; },
    bands() {   // faint target bands (after bandAfter failures); follow the wind slider
      const z = this.fails >= CONFIG.stage3.bandAfter ? this.zone(this.windU) : null;
      Gauge3.band(0, z && [z.dLo, z.dHi]);
      Gauge3.band(1, z && [z.gLo, z.gHi]);
    },
    startPlay() {
      const C = CONFIG.stage3;
      this.mode = 'play'; this.warm = 0; this.miss = 0;   // A14: the OK time (hold) is kept – it adds up
      this.side = this.x < C.xMin + 1 ? 1 : -1;   // normally starts walking left, with the wind
    },
    startRetreat() {
      const C = CONFIG.stage3, U = TEXT.ui;
      this.mode = 'retreat'; this.rx = clamp(this.x, C.xMin + 1, C.xMax - 1);
      UI.guideText(U.g3walkBack);
      if (this.fails === C.bandAfter) { this.bands(); UI.toast(U.g3band); }
      else if (this.last === 'side') UI.toast(U.g3retreat2);
    },
    turnTo(want, dt, rate) {
    let d = wrapA(want - this.yaw);
    // v1.4: a big turn always swings round through "facing you" (sin yaw < 0), never turning its back
    if (Math.abs(d) > 2.2 && Math.sin(this.yaw + d / 2) > 0) d -= Math.sign(d) * 2 * Math.PI;
    const st = clamp(d, -rate * dt, rate * dt);
    this.yaw = wrapA(this.yaw + st);
    this.turning = Math.abs(st) / dt;
    },
    speedTo(v, dt) { this.spd += (v - this.spd) * (1 - Math.exp(-dt / CONFIG.stage3.speedTau)); },
    // walk toward a point (x, s); returns the remaining distance
    steer(dt, tx, ts, v) {
      const dx = tx - this.x, ds = ts - this.s, dist = Math.hypot(dx, ds);
      if (dist < 1e-4) { this.speedTo(0, dt); return 0; }
      const want = Math.atan2(ds, dx);       // heading convention: x += cos(yaw)·v, s += sin(yaw)·v
      this.turnTo(want, dt, CONFIG.stage3.turnRate);
      const face = Math.max(0, Math.cos(wrapA(want - this.yaw)));
      this.speedTo(Math.min(v, dist * 1.2) * face, dt);
      return dist;
    },
    always(dt) {
      if (Flow.n !== 3 || !this.mode || dt <= 0) return;
      const C = CONFIG.stage3, Y = CONFIG.yak;
      const act = (md) => md === 'intro' || md === 'play' || md === 'stop' || md === 'retreat';
      if (Flow.state !== 'play' && act(this.mode)) { this.mode = 'settle'; UI.ctlOK(0, false); UI.ctlOK(1, false); Gauge3.next(-1); }
      if (Flow.state !== 'play' && Flow.state !== 'success') Gauge3.show(false);   // gone with the UI during 凝視
      const windy = act(this.mode);
      Cloud.windTarget = windy ? this.windDeg() : 0;   // after success the wind calms
      this.turning = 0;
      if (this.mode === 'intro') {
        if (this.steer(dt, C.startX, C.startS, C.introV) < 0.15) this.startPlay();
      } else if (this.mode === 'stop') {
        this.speedTo(0, dt);
        if ((this.stopT += dt) >= C.stopS) this.startRetreat();
      } else if (this.mode === 'retreat') {
        if (this.steer(dt, this.rx, C.retreatS, C.retreatV) < 0.15) this.startPlay();
      } else if (this.mode === 'play') {
        // A12: cos a along the tangent around the observer, sin a straight toward the observer's eye
        const a = rad(this.dir * 90), v = this.vNow(), ca = Math.cos(a), sa = Math.sin(a);
        const px = this.x, ps = this.s - obsS(), r = Math.hypot(px, ps) || 1;
        if (this.x < C.xMin) this.side = 1; else if (this.x > C.xMax) this.side = -1;
        const dx = (ca * this.side * ps - sa * px) / r, ds = (-ca * this.side * px - sa * ps) / r;
        const want = Math.atan2(ds, dx);
        this.turnTo(want, dt, C.turnRate);
        const face = Math.max(0.25, Math.cos(wrapA(want - this.yaw)));
        this.speedTo(v * face, dt);
      } else if (this.mode === 'settle') {
        if (this.steer(dt, Y.x, Y.s, C.settleV) < 0.25) this.mode = 'turn';
      } else if (this.mode === 'turn') {
        const k = 1 - Math.exp(-dt / 0.8);
        this.x += (Y.x - this.x) * k; this.s += (Y.s - this.s) * k;
        this.speedTo(0, dt);
        this.turnTo(0, dt, 0.5);
        if (Math.abs(this.yaw) < 0.004 && Math.abs(this.x - Y.x) + Math.abs(this.s - Y.s) < 0.01) {
          this.mode = 'rest'; this.yaw = 0; this.x = Y.x; this.s = Y.s; this.spd = 0;
        }
      }
      if (this.mode !== 'rest') {
        this.x += this.spd * Math.cos(this.yaw) * dt;
        this.s += this.spd * Math.sin(this.yaw) * dt;
      }
      // body follows the slope along its heading (nose up when walking up toward the crest)
      const cy = Math.cos(this.yaw), sy = Math.sin(this.yaw), L = 1.1;
      const hf = groundH(this.s + sy * L, this.x + cy * L), hb = groundH(this.s - sy * L, this.x - cy * L);
      const wantP = clamp(Math.atan2(hf - hb, 2 * L) * 0.7, -0.3, 0.3);
      this.pitch += (wantP - this.pitch) * (1 - Math.exp(-dt / 0.5));
      Yak.group.position.set(this.x, groundH(this.s, this.x), -this.s);
      Yak.group.rotation.set(0, this.yaw, this.pitch);
      Yak.treadmill = Math.max(0, Math.min(0.35, this.turning * 0.4) - this.spd);   // steps while turning in place
      if (windy) this.measure(dt);
      if (this.mode === 'play') this.evaluate(dt);
      if (windy) this.feedback(dt);
    },
    // angles seen from the eye: 斄牛 looming + lateral ω (smoothed); the cloud's ω scaled to the wind TARGET
    measure(dt) {
      const C = CONFIG.stage3, m = Measure.compute(), cam = camera.position, p = Yak.group.position, cp = Cloud.mesh.position;
      const b = deg(Math.atan2(p.x - cam.x, cam.z - p.z));      // bearing of the 斄牛 seen from the eye (+ = right)
      const cb = deg(Math.atan2(cp.x - cam.x, cam.z - cp.z));   // bearing of the big cloud
      if (this.prevTy !== null) {
        const k = 1 - Math.exp(-dt / C.measureTau), kc = 1 - Math.exp(-dt / C.gauge.cTau);
        this.loom += (((m.ty - this.prevTy) / (dt * m.ty)) * 100 - this.loom) * k;   // %/s
        this.latY += ((b - this.prevB) / dt - this.latY) * k;                         // °/s, signed
        // the cloud moved in the previous frame (noise-free); scaled to where the wind is heading → answers the slider at once
        const cNow = (cb - this.prevCB) / this.pdt, w = Cloud.wind;
        const ref = Math.abs(w) > 1e-3 ? cNow * Cloud.windTarget / w : -Cloud.windTarget;
        this.wRef += (ref - this.wRef) * kc;
      }
      this.prevTy = m.ty; this.prevB = b; this.prevCB = cb; this.pdt = dt;
      this.J = this.judge(this.latY, this.wRef, this.loom, this.vNow(), this.spd);
    },
    evaluate(dt) {
      const C = CONFIG.stage3, U = TEXT.ui, J = this.J;
      if (this.s <= C.minS) {            // at the crest without success → stop, say gently what was missing, then walk back
      if (this.hold >= C.holdS * C.crestPass) { Flow.success(); return; }   // v1.4: nearly there → it simply walks on
        this.mode = 'stop'; this.stopT = 0; this.miss = 0; this.fails++;   // A14: hold kept
        this.okD = 0; this.okS = 0; UI.ctlOK(0, false); UI.ctlOK(1, false); Gauge3.next(-1);
        UI.guideText(this.last === 'fast' ? U.g3stopFast : this.last === 'side' ? U.g3stopSide : U.g3stopShort);
        return;
      }
      this.warm += dt; this.playT += dt;
      if (!this.tipShown && this.playT > 5) { this.tipShown = true; UI.toast(U.g3frame); }
      if (this.warm < 1.2 || !J) return;
      // ONE control to change next: gait too fast → direction → looming
      const low = this.gaitU < this.zoneNow().gLo;
      let msg = U.g3calm, nx = -1, ar = '';
      if (!J.slow) { msg = U.g3fast; nx = 1; ar = '←'; }
      else if (!J.lat) {
        if (J.wrong) msg = U.g3wrong;
        else if (J.over) { msg = U.g3side; nx = 0; ar = '↺'; }
        else if (low) { msg = U.g3tooSlow; nx = 1; ar = '→'; }
        else { msg = U.g3lag; nx = 0; ar = '↻'; }
      } else if (this.loom < C.loomMin) {
        if (low) { msg = U.g3tooSlow; nx = 1; ar = '→'; }
        else { msg = U.g3slow; nx = 0; ar = '↺'; }
      }
      this.last = !J.slow ? 'fast' : !J.lat ? 'side' : 'short';
      UI.guideText(msg);
      Gauge3.next(nx, ar);
      // A10 soft frames: dial ↔ moving with the cloud, gait slider ↔ slow enough + gentle approach
      const kk = 1 - Math.exp(-dt / C.okTau);
      this.okD += ((J.lat ? 1 : 0) - this.okD) * kk;
      this.okS += ((J.slow && this.loom >= C.loomMin ? 1 : 0) - this.okS) * kk;
      UI.ctlOK(0, this.okD > 0.5);
      UI.ctlOK(1, this.okS > 0.5);
      if (J.all) { this.hold = Math.min(C.holdS, this.hold + dt); this.miss = 0; }
      else if ((this.miss += dt) > C.missGraceS) this.hold = Math.max(0, this.hold - C.drainK * dt);
      if (this.hold >= C.holdS) Flow.success();   // A14: no "risen" condition – it walks over the crest during 凝視
    },
    feedback(dt) {
      const C = CONFIG.stage3, J = this.J;
      if (!J) return;
      const m = -this.latY, sc = Math.max(0.15, -this.wRef), lm = this.loom;
      const fLat = J.lat ? 1 : clamp(1 - (m < J.lo ? J.lo - m : m - J.hi) / sc, 0, 1) * (J.wrong ? 0.4 : 1);
      const fLoom = lm < C.loomMin ? clamp(lm / C.loomMin, 0, 1) : clamp(1 - (lm - C.loomMax) / C.loomMax, 0, 1);
      const fGait = J.slow ? 1 : clamp(1 - (Math.max(this.vNow(), this.spd) - C.slowV) / (C.vMax - C.slowV), 0.1, 0.9);
      Gauge3.update({ c: this.wRef, y: this.latY, lo: -J.hi, hi: -J.lo, inW: J.lat,
        fills: [fLat, fLoom, fGait], oks: [J.lat, J.loom, J.slow], hold: this.hold / C.holdS }, dt);
      if (DEBUG.geo && (this.dbgT += dt) > 0.25) {
        this.dbgT = 0;
        DEBUG.info(DEBUG.geoLines.concat([
          `第三關：ω雲 ${this.wRef.toFixed(3)}°/s  ω斄牛 ${this.latY.toFixed(3)}°/s  逼近 ${lm.toFixed(2)}%/s  步速 ${this.spd.toFixed(2)} m/s（滑桿 ${this.vNow().toFixed(2)}）`,
          `持續 ${this.hold.toFixed(1)}/${C.holdS} s  失敗 ${this.fails} 次  距離 ${Math.hypot(this.x, this.s - obsS()).toFixed(1)} m  ${this.mode}`
        ]));
      }
    },
    exit() { Gauge3.next(-1); }
  },
  // 4 影子 – sliders: sky light, ground bounce. Hemisphere + bounce light; soft low-contrast shadows (never removed);
  // subtle rim glow on the fur edges; UnrealBloom; ACES. Success = both sliders high enough, held CONFIG.stage4.holdS s.
  // Feedback without numbers: guide line + soft frames that turn pale green (same style as stage 3).
  {
    enter() {
      this.hold = 0; this.okA = 0; this.okB = 0; this.t = 0; this.tip = false; this.touched = false;
      UI.showSliders([
        { frame: true, label: TEXT.ui.skyLight, v: Lighting.state.sky, on: (v) => { this.touched = true; Lighting.setSky(v); } },
        { frame: true, label: TEXT.ui.bounce, v: Lighting.state.bounce, on: (v) => { this.touched = true; Lighting.setBounce(v); } }
      ]);
      UI.guideText(TEXT.ui.g4start);
    },
    update(dt) {
      const C = CONFIG.stage4, U = TEXT.ui, s = Lighting.state;
      this.t += dt;
      if (!this.tip && this.t > 6) { this.tip = true; UI.toast(U.g3frame); }
      const a = s.sky >= C.skyOK, b = s.bounce >= C.bounceOK;
      const kk = 1 - Math.exp(-dt / C.okTau);
      this.okA += ((a ? 1 : 0) - this.okA) * kk;
      this.okB += ((b ? 1 : 0) - this.okB) * kk;
      UI.ctlOK(0, this.okA > 0.5);
      UI.ctlOK(1, this.okB > 0.5);
      if (!this.touched) UI.guideText(U.g4start);
      else UI.guideText(!a ? U.g4sky : !b ? U.g4bounce : U.g4calm);
      this.hold = (a && b) ? this.hold + dt : Math.max(0, this.hold - 2 * dt);
      if (this.hold >= C.holdS) { Lighting.solved = true; Flow.success(); }
    }
  },
  // 5 瞇眼 – default: focus far, near grass blurred (depth of field) + slight haze.
  // Two-finger pinch (A14: any direction, Input.spanY = finger distance) = eyelids close (top/bottom mask). Near blur → 0,
  // haze → 0, slight glare, the picture becomes a "flat painting". Success = eyes squinted (lid ≥ lidOK) for holdS s.
  // When the fingers are lifted the eyes open again very slowly (forgiving).
  // A14: no closing for idleHintS s → faint two-finger icon (#pinchIcon); squinted → "hold still" line;
  //      squinted ≥ 0.4 s, then opened again before success = one failure → gentle toast (hold about 3 s).
  {
    enter() {
      this.lid = 0; this.hold = 0; this.touched = false; this.idle = 0; this.icon = false; this.wasOK = false; this.fails = 0; this.vis = 1;
      const Y = CONFIG.yak;   // v1.4: world height where the standing crest line (with grass) cuts the 斄牛

      if (h.onTwoDrag) h.onTwoDrag(dx, dy);
      if (h.onPinchV) h.onPinchV(ds, sy);
    }
  },
  up(e) {
    if (!this.pts.has(e.pointerId)) return;
    const n = this.pts.size, p = this.pts.get(e.pointerId), h = this.handlers, g = this.g;
    if (h && g) {
      if (n === 1 && g.max === 1) {
        const dt = performance.now() - g.t0, tx = p.x - g.c0.x, ty = p.y - g.c0.y;
        if (Math.abs(tx) > 60 && Math.abs(tx) > Math.abs(ty) * 1.2 && dt < 900) { if (h.onSwipe) h.onSwipe(tx > 0 ? 'right' : 'left'); }
        else if (Math.abs(ty) > 60 && Math.abs(ty) > Math.abs(tx) * 1.2 && dt < 900) { if (h.onSwipe) h.onSwipe(ty > 0 ? 'down' : 'up'); }
        else if (g.moved < 12 && h.onTap) h.onTap();
      } else if (n === 2 && g.twoC) {
        const c = this.centroid(), ty = c.y - g.twoC.y;
        if (Math.abs(ty) > 60 && h.onTwoSwipe) h.onTwoSwipe(ty > 0 ? 'down' : 'up');
      }
    }
    this.pts.delete(e.pointerId);
    if (this.pts.size > 0) { this.lastC = this.centroid(); this.lastSpanY = this.spanY(); }
    else this.g = null;
  }
};

// Touch slider (value 0..1). Stops propagation so it never triggers scene gestures.
// A12: optional faint target band – el.setBand([lo, hi]) shows it, el.setBand(null) hides it.
function makeSlider(label, value, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'slider';
  wrap.innerHTML = '<div class="sl-label"></div><div class="sl-track"><div class="sl-band"></div><div class="sl-fill"></div><div class="sl-thumb"></div></div>';
  wrap.querySelector('.sl-label').textContent = label;
  const track = wrap.querySelector('.sl-track'), fill = wrap.querySelector('.sl-fill'), thumb = wrap.querySelector('.sl-thumb');
  const band = wrap.querySelector('.sl-band');
  let v = value, dragging = false;
  const set = (nv, fire) => {
    v = clamp(nv, 0, 1);
    fill.style.width = (v * 100) + '%';
    thumb.style.left = (v * 100) + '%';
    if (fire) onChange(v);
  };
  const fromEvent = (e) => { const r = track.getBoundingClientRect(); set((e.clientX - r.left) / r.width, true); };
  track.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    try { track.setPointerCapture(e.pointerId); } catch (_) {}
    dragging = true; fromEvent(e);
  });
  track.addEventListener('pointermove', (e) => { if (dragging) { e.preventDefault(); e.stopPropagation(); fromEvent(e); } });
  const end = () => { dragging = false; };
  track.addEventListener('pointerup', end);
  track.addEventListener('pointercancel', end);
  wrap.setBand = (r) => {
    if (r) { band.style.left = (r[0] * 100).toFixed(1) + '%'; band.style.width = ((r[1] - r[0]) * 100).toFixed(1) + '%'; }
    band.classList.toggle('on', !!r);
  };
  set(v, false);
  return { el: wrap, set: (x) => set(x, false), get: () => v };
}

// Touch direction dial (value 0..1 → arrow ← … ↓). A12: relative to the observer – arrow ← = the 斄牛 walks around you
// (leftward, with the wind), arrow ↓ = straight toward your eye. Drag anywhere on the dial. Stops propagation like
// makeSlider. Optional faint target band on the ring: el.setBand([lo, hi]) / el.setBand(null).
function makeDial(label, value, onChange, ends) {
  const wrap = document.createElement('div');
  wrap.className = 'dial';
  wrap.innerHTML = '<div class="sl-label"></div>' +
    '<svg viewBox="-75 -75 150 150" width="150" height="150">' +
    '<circle r="58" fill="rgba(10,22,44,.45)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>' +
    '<path class="band" d=""/>' +
    '<path d="M -58 0 A 58 58 0 0 0 0 58" fill="none" stroke="rgba(255,240,200,.85)" stroke-width="5" stroke-linecap="round"/>' +
    '<g class="ndl"><line x1="0" y1="0" x2="38" y2="0" stroke="#fff" stroke-width="5" stroke-linecap="round"/>' +
    '<path d="M 50 0 L 35 -10 L 35 10 Z" fill="#fff"/></g>' +
    '<circle r="8" fill="#f6f4ef" stroke="rgba(0,0,0,.3)"/>' +
    '<text class="dA" x="-40" y="-14" text-anchor="middle"></text>' +
    '<text class="dB" x="36" y="70" text-anchor="middle"></text>' +
    '</svg>';
  wrap.querySelector('.sl-label').textContent = label;
  wrap.querySelector('.dA').textContent = (ends && ends[0]) || '';
  wrap.querySelector('.dB').textContent = (ends && ends[1]) || '';
  const svg = wrap.querySelector('svg'), ndl = wrap.querySelector('.ndl'), bandP = wrap.querySelector('.band');
  let v = value, dragging = false;
  const set = (nv, fire) => {
    v = clamp(nv, 0, 1);
    ndl.setAttribute('transform', `rotate(${(180 - v * 90).toFixed(1)})`);   // 180 = left, 90 = down
    if (fire) onChange(v);
  };
  // v1.4: first touch jumps to the finger; dragging after that is amplified (more sensitive)
  const uAt = (e) => {
    const r = svg.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < 6) return null;
    const a = deg(Math.atan2(dy, dx));          // screen: 0 = right, 90 = down, ±180 = left
    return a >= 90 ? (180 - a) / 90 : a >= -90 ? 1 : 0;
  };
  const GAIN = 1.6;
  let u0 = 0, a0 = null;
  svg.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    dragging = true;
    const u = uAt(e);
    if (u !== null) set(u, true);
    u0 = v; a0 = u;
  });
  svg.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    e.preventDefault(); e.stopPropagation();
    const u = uAt(e);
    if (u === null) return;
    if (a0 === null) { a0 = u; u0 = v; return; }
    set(u0 + (u - a0) * GAIN, true);
    if (v <= 0 || v >= 1) { u0 = v; a0 = u; }   // at an end → reversing reacts at once
  });
  const end = () => { dragging = false; };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  const at = (u) => { const t = rad(180 - u * 90); return `${(58 * Math.cos(t)).toFixed(1)} ${(58 * Math.sin(t)).toFixed(1)}`; };
  wrap.setBand = (r) => {
    if (r) bandP.setAttribute('d', `M ${at(r[0])} A 58 58 0 0 0 ${at(r[1])}`);
    bandP.classList.toggle('on', !!r);
  };
  set(v, false);
  return { el: wrap, set: (x) => set(x, false), get: () => v };
}

const _bv = new THREE.Vector3();
const UI = {
  hudOn: false, mapOn: false, _hudTick: 0, holdK: 0, guideAllowed: false, guideMsg: null, _toastT: 0, ctls: [],
  init() {

  },
  checkPortrait() {

  reset() {
    // M9c: reset() always runs while #ui is hidden (start screen / 凝視) → hint, toast, guide are cut at once (no ghost)
    [this.hint, this.toastEl, this.guideEl].forEach((el) => this.swapText(el, null, { now: true }));
    this._toastT++; this.guideMsg = null;
    this.setDone(false);
    this.sliders.innerHTML = '';

  },
  overlays() {
    [this.victoryEl, this.sub, this.warmEl, this.whiteEl].forEach((el) => el.classList.remove('show'));
    this.flashEl.classList.remove('on');
  },
  // M9c: ONE helper for every changing text (releaseText, relTitle, subtitle, toast, guide, hint): fade out → wait until fully
  // transparent (transitionend, or timeout = CSS fade + 0.1 s) → change → 2 animation frames → fade in. t = null: fade out only.
  // o.prep(el) runs while transparent; o.onHidden(): transparent; o.onIn(): fade-in started; o.now: cut at once. Newer call wins.
  swapText(el, t, o = {}) {
    const tk = el._swTk = (el._swTk || 0) + 1, cls = (el === this.releaseText || el === this.relTitle) ? 'in' : 'show';
    const live = () => tk === el._swTk, op = parseFloat(getComputedStyle(el).opacity) || 0;
    const change = () => {
      if (!live()) return;
      if (o.onHidden) o.onHidden();
      if (t === null) return;
      el.textContent = t;
      if (o.prep) o.prep(el);
      requestAnimationFrame(() => requestAnimationFrame(() => { if (live()) { el.classList.add(cls); if (o.onIn) o.onIn(); } }));
    };
    if (t !== null && !o.prep && el.textContent === t && (el.classList.contains(cls) || op > 0.01)) {   // same text still showing
      el.classList.add(cls); if (o.onIn) o.onIn(); return;
    }
    if (o.now) { el.style.transition = 'none'; el.classList.remove(cls); void el.offsetWidth; el.style.transition = ''; change(); return; }
    if (!el.classList.contains(cls) && op < 0.01) { change(); return; }
    el.classList.remove(cls);
    const d = getComputedStyle(el).transitionDuration.split(',')[0], fs = parseFloat(d) / (d.indexOf('ms') > 0 ? 1000 : 1) || 0;
    let fired = false;
